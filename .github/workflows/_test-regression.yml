name: _test-regression (reusable)

on:
  workflow_call:
    inputs:
      attempt:
        required: true
        type: string
      runner:
        required: true
        type: string
      run_tag:
        required: true
        type: string
      reg_url:
        required: true
        type: string
      prepull_flow_images:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REG_URL: ${{ inputs.reg_url }}
  PREPULL_FLOW_IMAGES: ${{ inputs.prepull_flow_images }}

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      VERSION: develop
      DOCKER_TAG_NAME: ${{ inputs.run_tag }}
      PLUGINS_IMAGE_TAG: ${{ inputs.run_tag }}
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Increase swapfile to 15G
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: npm install
        if: success() || failure()
        run: npm install

      # UI is not needed for regression tests
      # so we skip downloading and extracting the UI package to save time and resources.
      # - name: Download UI package tarball
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: ui-tgz
      #     path: ./plugins/ui

      # - name: Extract UI package
      #   run: |
      #     TGZ=$(ls ./plugins/ui/data2evidence-d2e-ui-*.tgz | head -1)
      #     rm -rf ./plugins/ui-built
      #     mkdir -p ./plugins/ui-built
      #     tar -xzf "$TGZ" -C ./plugins/ui-built --strip-components=1

      - name: Initialise d2e
        if: success() || failure()
        run: |
          init_choice=y ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v develop init
          grep LOGTO__D2E_APP__CLIENT_ID .env | sed -e "s/'//g" >> $GITHUB_ENV

      - name: Pre-pull flow images
        run: |
          for img in $PREPULL_FLOW_IMAGES; do
            docker pull "${REG_URL}/d2e/${img}:${DOCKER_TAG_NAME}"
          done

      - name: Pull docker compose images
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v develop -d ./plugins/functions pull
          docker images --format "table {{.ID}}\t{{.Repository}}\t{{.Tag}}"

      - name: Start services
        if: success() || failure()
        uses: nick-fields/retry@v3
        id: start
        with:
          timeout_seconds: 1800
          retry_wait_seconds: 100
          max_attempts: 2
          retry_on: any
          command: |
            ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions -c ./docker-compose-ci.yml start
            DC_EXIT_CODE=$?
            DOCKER_STATUS_FILE=../docker-status-${GITHUB_RUN_ID:-ghRunId}-$(date '+%Y%m%dT%H%M%S').txt | tee -a $GITHUB_ENV
            docker ps --format {{.Names}},{{.Status}} 2> /dev/null | sort | tee $DOCKER_STATUS_FILE | tee -a $GITHUB_STEP_SUMMARY
            [ $DC_EXIT_CODE = 0 ] || { echo EXIT DC_EXIT_CODE=$DC_EXIT_CODE && exit $DC_EXIT_CODE; }

      - name: Wait for services to be ready
        if: success() || failure()
        run: |
          for i in $(seq 1 60); do
            NOT_READY=$(docker ps --format '{{.Names}},{{.Status}}' | grep -E 'health: starting|unhealthy' || true)
            if [ -z "$NOT_READY" ]; then
              echo "All services healthy after ${i} checks"
              break
            fi
            echo "Waiting for services to become healthy (attempt ${i}/60)..."
            echo "$NOT_READY"
            sleep 5
          done
          docker ps --format '{{.Names}},{{.Status}}' | sort

      - name: Setup HTTP Test Env
        if: success() || failure()
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 1800
          retry_wait_seconds: 100
          max_attempts: 1
          retry_on: any
          command: |
            ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions setuphttptestenv
            DC_EXIT_CODE=$?
            DOCKER_STATUS_FILE=../docker-status-${GITHUB_RUN_ID:-ghRunId}-$(date '+%Y%m%dT%H%M%S').txt | tee -a $GITHUB_ENV
            docker ps --format {{.Names}},{{.Status}} 2> /dev/null | sort | tee $DOCKER_STATUS_FILE | tee -a $GITHUB_STEP_SUMMARY
            [ $DC_EXIT_CODE = 0 ] || { echo EXIT DC_EXIT_CODE=$DC_EXIT_CODE && exit $DC_EXIT_CODE; }

      - name: Get dataset Id
        run: |
          export resDataset=$(docker exec d2e-minerva-postgres-1 psql -h localhost -U postgres -p 5432 -d alp -c "select * from portal.dataset" 2>/dev/null)
          echo "$resDataset"
          export resDatasetDetail=$(docker exec d2e-minerva-postgres-1 psql -h localhost -U postgres -p 5432 -d alp -c "select * from portal.dataset_detail" 2>/dev/null)
          echo "$resDatasetDetail"
          export resTrexDB=$(docker exec d2e-minerva-postgres-1 psql -h localhost -U postgres -p 5432 -d alp -c "select * from trex.db" 2>/dev/null)
          echo "$resTrexDB"
          export DATASET_ID=$(docker exec d2e-minerva-postgres-1 psql -h localhost -U postgres -p 5432 -d alp -t -c "select id from portal.dataset where type IN ('omop', 'webapi')" 2>/dev/null | head -1 | xargs)
          echo "DATASET_ID=$DATASET_ID" >> $GITHUB_ENV

      - name: Logs
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions logs

      - name: Checkflow
        if: success() || failure()
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 1800
          retry_wait_seconds: 100
          max_attempts: 1
          retry_on: any
          command: |
            ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions checkflow
            DC_EXIT_CODE=$?
            [ $DC_EXIT_CODE = 0 ] || { echo EXIT DC_EXIT_CODE=$DC_EXIT_CODE && exit $DC_EXIT_CODE; }

      - name: Restart d2e services
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions -c ./docker-compose-ci.yml stop
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions -c ./docker-compose-ci.yml -p 41100 start

      - name: Log in and get Bearer token
        run: |
          # One script for both IdPs; see the script for why the flows differ.
          # Exports BEARER_TOKEN, REFRESH_TOKEN and IDP_SUB to $GITHUB_ENV.
          bash tests/backend_integration_tests/lib/ci-login.sh

      - name: Wait for the dataset cache to be attached
        run: |
          # The restart above drops every attached cache and re-attaches during
          # boot, and the container reports healthy well before that finishes.
          # Querying in that window resolves no cache catalog at all and fails
          # with a catalog error naming the first table the scenario touches, so
          # wait for the cache to answer for itself before the scenarios run.
          for attempt in $(seq 1 60); do
            status=$(curl -sk \
              "https://localhost:41100/system-portal/dataset/$DATASET_ID/cache-status" \
              --header "Authorization: Bearer $BEARER_TOKEN")
            echo "cache-status: $status"
            case "$status" in
              *'"cacheAttached":true'*) echo "Cache attached after ~$((attempt * 5))s."; exit 0 ;;
            esac
            sleep 5
          done
          echo "Cache was still not attached after 300s; running anyway."

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install regression test dependencies
        working-directory: ./tests/regression
        run: npm install

      - name: Run regression performance tests
        working-directory: ./tests/regression
        env:
          BEARER_TOKEN: ${{ env.BEARER_TOKEN }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: npm run test

      - name: Upload regression failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure-report-${{ inputs.attempt }}
          path: ./tests/regression/test-results/
          overwrite: true

      - name: Mark regression attempt success
        if: success()
        run: |
          mkdir -p ./_attempt
          touch ./_attempt/success

      - name: Upload regression attempt outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-attempt-${{ inputs.attempt }}
          path: ./_attempt/
          overwrite: true

      - name: Logs
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions logs

      - name: Stop d2e services
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions stop

      - name: Prune system
        if: always()
        run: docker system prune -af
