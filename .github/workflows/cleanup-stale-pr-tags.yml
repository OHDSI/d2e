name: Cleanup stale PR/MG container tags

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ohdsi
      MAX_AGE_HOURS: 24
    strategy:
      fail-fast: false
      matrix:
        image:
          - d2e/flow-base
          - d2e/flow-i2b2
          - d2e/flow-search-embedding
          - d2e/flow-data-management
          - d2e/flow-loyalty-score
          - d2e/flow-hades
          - d2e/flow-data-transformation
          - d2e-pg-mgmt-init
          - d2e-logto
          - d2e-logto-post-init
          - d2e-enterprise-gateway
          - d2e-r-ohdsi-kernel
          - d2e-trex
          - d2e-dataflow-gen
          - d2e-dataflow-gen-worker
          - d2e-supabase-storage
    steps:
      - name: Sweep pr-* and mg-* tags older than ${{ env.MAX_AGE_HOURS }}h
        run: |
          PKG_NAME="${{ matrix.image }}"
          PKG_ENC=$(echo "$PKG_NAME" | sed 's|/|%2F|g')

          cutoff=$(date -u -d "${MAX_AGE_HOURS} hours ago" +%s)

          page=1
          while :; do
            resp=$(gh api -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${PKG_ENC}/versions?per_page=100&page=${page}")
            count=$(echo "$resp" | jq 'length')
            if [ "$count" = "0" ]; then break; fi

            # Delete a version only when EVERY tag on it is pr-/mg-.
            #
            # The API deletes versions, not tags, and identical image content is
            # deduped onto ONE version — so a stable image ends up with a single
            # version carrying many tags. d2e-logto currently has one version
            # tagged with five pr-* tags AND develop-a6b76bf AND develop-a0e1d4a.
            # Matching any single stale pr-* tag therefore deleted develop with
            # it, which is why the images that change least (d2e-logto,
            # d2e-dataflow-gen-worker) keep only one develop-* tag while the
            # others keep 50+, and why ghcr.io/ohdsi/d2e-dataflow-gen-worker:develop
            # now resolves to a manifest that no longer exists. That broke every
            # downstream e2e that pulls the develop image set.
            echo "$resp" | jq -r '
              .[]
              | . as $v
              | (.metadata.container.tags // []) as $tags
              | select(($tags | length) > 0 and (all($tags[]; test("^(pr-|mg-)"))))
              | "\($v.id) \($v.updated_at) \($tags | join(","))"
            ' | while read vid updated tag; do
              vid_ts=$(date -u -d "$updated" +%s)
              if [ "$vid_ts" -lt "$cutoff" ]; then
                echo "Deleting ${PKG_NAME} v${vid} tag=${tag} updated=${updated}"
                gh api -X DELETE -H "Accept: application/vnd.github+json" \
                  "/orgs/${OWNER}/packages/container/${PKG_ENC}/versions/${vid}" || true
              fi
            done

            page=$((page + 1))
          done

  sweep_e2e:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ohdsi
      MAX_AGE_HOURS: 24
    steps:
      - name: Sweep all d2e-e2e tags older than ${{ env.MAX_AGE_HOURS }}h
        run: |
          PKG_NAME=d2e-e2e
          cutoff=$(date -u -d "${MAX_AGE_HOURS} hours ago" +%s)

          page=1
          while :; do
            resp=$(gh api -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${PKG_NAME}/versions?per_page=100&page=${page}")
            count=$(echo "$resp" | jq 'length')
            if [ "$count" = "0" ]; then break; fi

            echo "$resp" | jq -r '
              .[]
              | "\(.id) \(.updated_at)"
            ' | while read vid updated; do
              vid_ts=$(date -u -d "$updated" +%s)
              if [ "$vid_ts" -lt "$cutoff" ]; then
                echo "Deleting ${PKG_NAME} v${vid} updated=${updated}"
                gh api -X DELETE -H "Accept: application/vnd.github+json" \
                  "/orgs/${OWNER}/packages/container/${PKG_NAME}/versions/${vid}" || true
              fi
            done

            page=$((page + 1))
          done
