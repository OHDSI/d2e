name: d2e/demosetup-release

on:
  schedule:
    - cron: "0 22 * * 0" # UTC timing
  workflow_dispatch:
    inputs:
      version:
        default: "0.18.0-beta"
        description: Enter version to use
        required: true
        type: string

env:
  DEFAULT_VERSION: "0.18.0-beta"

jobs:
  demosetup:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install d2e CLI
        if: success() || failure()
        id: install
        run: |
          # Dispatch passes the input; scheduled runs fall back to the
          # workflow_dispatch default version above.
          VERSION="${{ github.event.inputs.version || env.DEFAULT_VERSION }}"
          VERSION="${VERSION#v}"  
          PLATFORM="linux-x64"   
          mkdir -p d2e-cli
          curl -fSL "https://github.com/OHDSI/Data2Evidence/releases/download/v$VERSION/data2evidence-cli-$VERSION-$PLATFORM" -o d2e-cli/d2e
          chmod +x d2e-cli/d2e
          ./d2e-cli/d2e --version || true
      
      - name: Initialise d2e
        if: success() || failure()
        id: init
        working-directory: d2e-cli
        run: |
          init_choice=y ./d2e init

      - name: Pull docker images
        if: success() || failure()
        id: pull
        working-directory: d2e-cli
        run: |
          ./d2e -e pull
          docker images --format "table {{.ID}}\t{{.Repository}}\t{{.Tag}}"

      - name: Start services
        if: success() || failure()
        uses: nick-fields/retry@v3
        id: start
        with:
          timeout_seconds: 1800
          retry_wait_seconds: 100
          max_attempts: 3
          retry_on: any
          command: |
            cd d2e-cli
            ./d2e -e start
            sleep 300
            DC_EXIT_CODE=$?
            DOCKER_STATUS_FILE=../docker-status-${GITHUB_RUN_ID:-ghRunId}-$(date '+%Y%m%dT%H%M%S').txt | tee -a $GITHUB_ENV
            docker ps --format {{.Names}},{{.Status}} 2> /dev/null | sort | tee $DOCKER_STATUS_FILE | tee -a $GITHUB_STEP_SUMMARY
            [ $DC_EXIT_CODE = 0 ] || { echo EXIT DC_EXIT_CODE=$DC_EXIT_CODE && exit $DC_EXIT_CODE; }
      - name: Wait for services to be ready
        if: success() || failure()
        run: |
          echo "Waiting for services to be ready..."  | tee -a $GITHUB_STEP_SUMMARY
          sleep 300
          docker ps --format {{.Names}},{{.Status}} 2> /dev/null | sort | tee -a $GITHUB_STEP_SUMMARY
      - name: Log status
        if: success() || failure()
        run: |
          echo "Logging status..."  | tee -a $GITHUB_STEP_SUMMARY
          echo DC_EXIT_CODE=$DC_EXIT_CODE | tee -a $GITHUB_STEP_SUMMARY
          echo RETRY_EXIT_CODE=${{ steps.start.outputs.exit_code }} | tee -a $GITHUB_STEP_SUMMARY
          echo RETRY_OUTCOME=${{ steps.start.outcome }} | tee -a $GITHUB_STEP_SUMMARY
          echo RETRY_TOTAL_ATTEMPTS=${{ steps.start.outputs.total_attempts }} | tee -a $GITHUB_STEP_SUMMARY
          DC_FAIL_COUNT=$(grep -icE "starting|unhealthy" $DOCKER_STATUS_FILE|| true)
          echo DC_FAIL_COUNT=$DC_FAIL_COUNT | tee -a $GITHUB_STEP_SUMMARY
      
      - name: Logs
        if: success() || failure()
        working-directory: d2e-cli
        run: |
          ./d2e logs
 
      - name: Setupdemo
        if: success() || failure()
        uses: nick-fields/retry@v3
        id: setupdemo
        with:
          timeout_seconds: 1800
          retry_wait_seconds: 100
          max_attempts: 3
          retry_on: any
          command: |
            cd d2e-cli
            ./d2e -e setupdemo
            DC_EXIT_CODE=$?
            DOCKER_STATUS_FILE=../docker-status-${GITHUB_RUN_ID:-ghRunId}-$(date '+%Y%m%dT%H%M%S').txt | tee -a $GITHUB_ENV
            docker ps --format {{.Names}},{{.Status}} 2> /dev/null | sort | tee $DOCKER_STATUS_FILE | tee -a $GITHUB_STEP_SUMMARY
            [ $DC_EXIT_CODE = 0 ] || { echo EXIT DC_EXIT_CODE=$DC_EXIT_CODE && exit $DC_EXIT_CODE; }
  
      - name: Checkflow
        if: success() || failure()
        uses: nick-fields/retry@v3
        id: checkflow
        with:
          timeout_seconds: 1800
          retry_wait_seconds: 100
          max_attempts: 3
          retry_on: any
          command: |
            cd d2e-cli
            ./d2e checkflow
            DC_EXIT_CODE=$?
            [ $DC_EXIT_CODE = 0 ] || { echo EXIT DC_EXIT_CODE=$DC_EXIT_CODE && exit $DC_EXIT_CODE; }

      - name: Stop d2e services
        if: success() || failure()
        id: stop
        working-directory: d2e-cli
        run: |
          ./d2e -e stop
      - name: Clean d2e services
        if: success() || failure()
        id: clean
        working-directory: d2e-cli
        run: |
          echo "y" | ./d2e clean

      - name: Discord notification on status
        if: success() || failure()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_DEVOPS }}
          username: ${{ github.actor }}
          content: "### Status of Installation\n
            install: ${{ steps.install.outcome }}\n
            init: ${{ steps.init.outcome }}\n
            pull: ${{ steps.pull.outcome }}\n
            start: ${{ steps.start.outcome }}\n
            patchdemodb: ${{ steps.patchdemodb.outcome }}\n
            setupdemo: ${{ steps.setupdemo.outcome }}\n
            checkflow: ${{ steps.checkflow.outcome }}\n
            stop: ${{ steps.stop.outcome }}"