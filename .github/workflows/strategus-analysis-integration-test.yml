name: Strategus Analysis Integration Test

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC on main branch
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  VERSION: develop
  DOCKER_TAG_NAME: develop
  REG_URL: ghcr.io/ohdsi
  PGUSER: postgres
  PGPASSWORD: mypass
  PGHOST: localhost
  PGPORT: 15432
  PGDATABASE: postgres
  TESTSCHEMA: demo_cdm
  isTestEnv: "true"
  isHttpTestRun: "true"
  HTTPTEST_DB_DIALECT: "duckdb"

jobs:
  strategus-analysis-integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Increase swapfile to 15G
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: npm install
        if: success() || failure()
        run: npm install

      - name: Initialise d2e
        if: success() || failure()
        run: |
          init_choice=y ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v develop init
          grep LOGTO__D2E_APP__CLIENT_ID .env | sed -e "s/'//g" >> $GITHUB_ENV

      - name: Pull docker compose images
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v develop -d ./plugins/functions pull
          docker images --format "table {{.ID}}\t{{.Repository}}\t{{.Tag}}"

      - name: Start services
        if: success() || failure()
        uses: nick-fields/retry@v3
        id: start
        with:
          timeout_seconds: 1800
          retry_wait_seconds: 100
          max_attempts: 2
          retry_on: any
          command: |
            ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions -c ./docker-compose-ci.yml start
            DC_EXIT_CODE=$?
            DOCKER_STATUS_FILE=../docker-status-${GITHUB_RUN_ID:-ghRunId}-$(date '+%Y%m%dT%H%M%S').txt | tee -a $GITHUB_ENV
            docker ps --format {{.Names}},{{.Status}} 2> /dev/null | sort | tee $DOCKER_STATUS_FILE | tee -a $GITHUB_STEP_SUMMARY
            [ $DC_EXIT_CODE = 0 ] || { echo EXIT DC_EXIT_CODE=$DC_EXIT_CODE && exit $DC_EXIT_CODE; }

      - name: Log status
        if: success() || failure()
        run: |
          echo DC_EXIT_CODE=$DC_EXIT_CODE | tee -a $GITHUB_STEP_SUMMARY
          echo RETRY_EXIT_CODE=${{ steps.start.outputs.exit_code }} | tee -a $GITHUB_STEP_SUMMARY
          echo RETRY_OUTCOME=${{ steps.start.outcome }} | tee -a $GITHUB_STEP_SUMMARY
          echo RETRY_TOTAL_ATTEMPTS=${{ steps.start.outputs.total_attempts }} | tee -a $GITHUB_STEP_SUMMARY
          DC_FAIL_COUNT=$(grep -icE "starting|unhealthy" $DOCKER_STATUS_FILE || true)
          echo DC_FAIL_COUNT=$DC_FAIL_COUNT | tee -a $GITHUB_STEP_SUMMARY

      - name: Logs
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions logs

      - name: Wait for services to be ready before setup
        if: success() || failure()
        run: |
          for i in $(seq 1 60); do
            NOT_READY=$(docker ps --format '{{.Names}},{{.Status}}' | grep -E 'health: starting|unhealthy' || true)
            if [ -z "$NOT_READY" ]; then
              echo "All services healthy after ${i} checks"
              break
            fi
            echo "Waiting for services to become healthy (attempt ${i}/60)..."
            echo "$NOT_READY"
            sleep 5
          done
          docker ps --format '{{.Names}},{{.Status}}' | sort

      - name: Setupdemo
        if: success() || failure()
        uses: nick-fields/retry@v3
        id: setupdemo
        with:
          timeout_seconds: 1800
          retry_wait_seconds: 100
          max_attempts: 2
          retry_on: any
          command: |
            ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }}  -d ./plugins/functions setupdemo
            DC_EXIT_CODE=$?
            DOCKER_STATUS_FILE=../docker-status-${GITHUB_RUN_ID:-ghRunId}-$(date '+%Y%m%dT%H%M%S').txt | tee -a $GITHUB_ENV
            docker ps --format {{.Names}},{{.Status}} 2> /dev/null | sort | tee $DOCKER_STATUS_FILE | tee -a $GITHUB_STEP_SUMMARY
            [ $DC_EXIT_CODE = 0 ] || { echo EXIT DC_EXIT_CODE=$DC_EXIT_CODE && exit $DC_EXIT_CODE; }

      - name: Get dataset Id
        run: |
          export resDataset=$(docker exec d2e-minerva-postgres-1 psql -h localhost -U postgres -p 5432 -d alp -c "select * from portal.dataset" 2>/dev/null)
          echo "$resDataset"
          export resDatasetDetail=$(docker exec d2e-minerva-postgres-1 psql -h localhost -U postgres -p 5432 -d alp -c "select * from portal.dataset_detail" 2>/dev/null)
          echo "$resDatasetDetail"
          export resTrexDB=$(docker exec d2e-minerva-postgres-1 psql -h localhost -U postgres -p 5432 -d alp -c "select * from trex.db" 2>/dev/null)
          echo "$resTrexDB"
          export DATASET_ID=$(docker exec d2e-minerva-postgres-1 psql -h localhost -U postgres -p 5432 -d alp -t -c "select id from portal.dataset where type IN ('omop', 'webapi')" 2>/dev/null | head -1 | xargs)
          export DATABASE_NAME=$(docker exec d2e-minerva-postgres-1 psql -h localhost -U postgres -p 5432 -d alp -t -c "select cache_id from portal.dataset where type IN ('omop', 'webapi')" 2>/dev/null | head -1 | xargs)
          echo "DATASET_ID=$DATASET_ID" >> $GITHUB_ENV
          echo "TESTSCHEMA=$TESTSCHEMA" >> $GITHUB_ENV

      - name: Logs
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions logs

      - name: Checkflow
        if: success() || failure()
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 1800
          retry_wait_seconds: 100
          max_attempts: 1
          retry_on: any
          command: |
            ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions checkflow
            DC_EXIT_CODE=$?
            [ $DC_EXIT_CODE = 0 ] || { echo EXIT DC_EXIT_CODE=$DC_EXIT_CODE && exit $DC_EXIT_CODE; }

      - name: Restart d2e services
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions -c ./docker-compose-ci.yml stop
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions -c ./docker-compose-ci.yml -p 41100 start

      - name: Check status of docker containers
        run: docker ps -a

      - name: Log in and get Bearer token and sub
        run: |
          # One script for both IdPs; see the script for why the flows differ.
          # Exports BEARER_TOKEN, REFRESH_TOKEN and IDP_SUB to $GITHUB_ENV.
          bash tests/backend_integration_tests/lib/ci-login.sh
      - name: Check status of docker containers
        run: docker ps -a

      - name: Check PG DB connection
        run: |
          PGPASSWORD=$(echo $(docker exec d2e-trex printenv DEMO__DB_PASSWORD))
          sudo apt install -y postgresql-client
          pg_isready -d ${PGDATABASE} -h ${PGHOST} -p ${PGPORT} -U ${PGUSER}
          psql -h ${PGHOST} -p ${PGPORT} -U ${PGUSER} -d ${PGDATABASE}

      - name: Install dependencies in backend integration tests
        run: |
          cd ./tests/backend_integration_tests/pg
          yarn

      - name: Set env vars for HTTP tests
        run: |
          echo "PGPASSWORD=$(echo $(docker exec d2e-trex printenv DEMO__DB_PASSWORD))" >> $GITHUB_ENV
          echo "PGPORT=${PGPORT}" >> $GITHUB_ENV
          echo "PGUSER=${PGUSER}" >> $GITHUB_ENV
          echo "PGHOST=${PGHOST}" >> $GITHUB_ENV
          echo "TESTSCHEMA=${TESTSCHEMA}" >> $GITHUB_ENV
          echo "HDIPORT=${PGPORT}" >> $GITHUB_ENV
          echo "HDIPW=$(echo $(docker exec d2e-trex printenv DEMO__DB_PASSWORD))" >> $GITHUB_ENV
          echo "HDIUSER=${PGUSER}" >> $GITHUB_ENV
          echo "HANASERVER=${PGHOST}" >> $GITHUB_ENV
          echo "PGDATABASE=${PGDATABASE}" >> $GITHUB_ENV
          echo "isHttpTestRun=${isHttpTestRun}" >> $GITHUB_ENV
          echo "isTestEnv=${isTestEnv:-false}" >> $GITHUB_ENV
          echo "HTTPTEST_DB_DIALECT=${HTTPTEST_DB_DIALECT:-duckdb}" >> $GITHUB_ENV

      - name: Run strategus analysis integration test
        working-directory: ./tests/backend_integration_tests/pg
        run: |
          echo "HDIPORT: ${HDIPORT}"
          echo "HDIPW: ${HDIPW}"
          echo "HDIUSER: ${HDIUSER}"
          echo "HANASERVER: ${HANASERVER}"
          echo "PGDATABASE: ${PGDATABASE}"
          echo "isHttpTestRun: ${isHttpTestRun}"
          echo "isTestEnv: ${isTestEnv:-false}"
          echo "TESTSCHEMA: ${TESTSCHEMA}"
          echo "HTTPTEST_DB_DIALECT: ${HTTPTEST_DB_DIALECT}"
          echo "DATASET_ID: ${DATASET_ID}"
          yarn test-specs --test_schema_name=$TESTSCHEMA '--file_pattern=strategus_analysis_test\.js$' '--mocha-timeout=400000'

      - name: Collect Prefect diagnostics on flow run failure
        if: failure() && env.PREFECT_FLOW_RUN_ID != ''
        env:
          PREFECT_BASE: https://localhost:41100/d2e/prefect/d2e/api
        run: |
          sudo apt-get install -y jq 2>/dev/null || true
          mkdir -p ./prefect-diagnostics

          FLOW_RUN_ID="${PREFECT_FLOW_RUN_ID}"

          echo "## Prefect Flow Run Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Flow Run ID:** \`${FLOW_RUN_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "**UI:** ${PREFECT_BASE}/runs/flow-run/${FLOW_RUN_ID}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get sub-flow runs
          SUB_RUNS_JSON=$(curl -sk -X POST "${PREFECT_BASE}/flow_runs/filter" \
            -H "Authorization: Bearer ${BEARER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "{\"flow_runs\":{\"parent_flow_run_id\":{\"any_\":[\"${FLOW_RUN_ID}\"]}}}")
          echo "${SUB_RUNS_JSON}" > ./prefect-diagnostics/sub_flow_runs.json

          # Build JSON array of all run IDs (parent + sub)
          SUB_RUN_IDS=$(echo "${SUB_RUNS_JSON}" | jq -r '.[].id' 2>/dev/null | tr '\n' ' ')
          ALL_IDS_JSON=$(printf '%s\n' "${FLOW_RUN_ID}" ${SUB_RUN_IDS} | jq -Rn '[inputs]')

          # Fetch logs (ERROR level = 40+)
          LOGS_JSON=$(curl -sk -X POST "${PREFECT_BASE}/logs/filter" \
            -H "Authorization: Bearer ${BEARER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "{\"logs\":{\"flow_run_id\":{\"any_\":${ALL_IDS_JSON}}},\"sort\":\"TIMESTAMP_ASC\"}")
          echo "${LOGS_JSON}" > ./prefect-diagnostics/logs.json

          echo "### Error Logs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${LOGS_JSON}" | jq -r '.[] | select(.level >= 40) | "[" + .timestamp + "] " + .message' \
            2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "(failed to parse logs)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fetch artifacts
          ARTIFACTS_JSON=$(curl -sk -X POST "${PREFECT_BASE}/artifacts/filter" \
            -H "Authorization: Bearer ${BEARER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "{\"artifacts\":{\"flow_run_id\":{\"any_\":${ALL_IDS_JSON}}}}")
          echo "${ARTIFACTS_JSON}" > ./prefect-diagnostics/artifacts.json

          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          while IFS=$'\t' read -r artifact_id artifact_key; do
            [ -z "${artifact_id}" ] && continue
            echo "- **${artifact_key}** (\`${artifact_id}\`): ${PREFECT_BASE}/artifacts/artifact/${artifact_id}" >> $GITHUB_STEP_SUMMARY
          done < <(echo "${ARTIFACTS_JSON}" | jq -r '.[] | [.id, (.key // .type // "artifact")] | @tsv' 2>/dev/null)
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Sub-Flow Runs" >> $GITHUB_STEP_SUMMARY
          while IFS=$'\t' read -r sub_id sub_name sub_state; do
            [ -z "${sub_id}" ] && continue
            echo "- **${sub_name}** \`${sub_state}\`: ${PREFECT_BASE}/runs/flow-run/${sub_id}" >> $GITHUB_STEP_SUMMARY
          done < <(echo "${SUB_RUNS_JSON}" | jq -r '.[] | [.id, (.name // "sub-run"), (.state_type // "UNKNOWN")] | @tsv' 2>/dev/null)

      - name: Upload Prefect diagnostics
        if: failure() && env.PREFECT_FLOW_RUN_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: prefect-diagnostics
          path: ./prefect-diagnostics/
          if-no-files-found: ignore

      - name: Logs
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions logs

      - name: Stop d2e services
        if: success() || failure()
        run: |
          ENV_TYPE=remote CADDY__CONFIG=./deploy/caddy-config node ./scripts/dist/cli.js -e -v ${{ env.VERSION }} -d ./plugins/functions stop

      - name: Prune system
        if: always()
        run: docker system prune -af
