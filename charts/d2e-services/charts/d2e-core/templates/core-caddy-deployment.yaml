apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    profile: d2e-core-caddy
  name: "{{ .Release.Name }}-{{ .Chart.Name }}-caddy"
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 3
  selector:
    matchLabels:
      profile: d2e-core-caddy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        profile: d2e-core-caddy
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      restartPolicy: Always
      containers:
        - name: caddy
          args:
            - caddy
            - run
            - --environ
            - --config
            - /srv/caddy-config/Caddyfile
            - --adapter
            - caddyfile
          env:
            - name: CADDY__D2E__INTERNAL_FQDN
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: CADDY__D2E__INTERNAL_FQDN
            - name: CADDY__D2E__PUBLIC_FQDN
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: CADDY__D2E__PUBLIC_FQDN
            - name: TREX__D2E__INTERNAL_FQDN
              value: trex.{{ .Release.Namespace }}.svc.cluster.local:443 # NOT trex-http!!
            - name: TLS__CADDY_DIRECTIVE
              value: tls internal
          image: caddy:2.11-alpine
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /check-liveness
              port: 8080
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /check-liveness
              port: 8080
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
          ports:
            - containerPort: 443
              protocol: TCP
            - containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.global.resources.caddy | nindent 12 }}
          volumeMounts:
            - mountPath: /srv/caddy-config
              name: d2e-caddy-cm
            - mountPath: /data/caddy/pki/authorities/local/root.crt
              name: caddy-local-pki
              subPath: ROOT__PKI__CA_CRT
            - mountPath: /data/caddy/pki/authorities/local/root.key
              name: caddy-local-pki
              subPath: ROOT__PKI__CA_KEY
            - mountPath: /data/caddy/certificates/local/k8s.d2e.sg/k8s.d2e.sg.crt
              name: caddy-local-pki
              subPath: SERVER__CRT
            - mountPath: /data/caddy/certificates/local/k8s.d2e.sg/k8s.d2e.sg.key
              name: caddy-local-pki
              subPath: SERVER__KEY
            - mountPath: /etc/d2e/tls
              name: d2e-tls
              readOnly: true
      volumes:
        - name: d2e-caddy-cm
          configMap:
            name: "{{ .Release.Name }}-{{ .Chart.Name }}-caddy"
        - name: caddy-local-pki
          secret:
            secretName: "{{ .Release.Name }}-{{ .Chart.Name }}-caddy"
        # Internal TLS material from the chart-level secret, not the -caddy one
        # above: the -caddy secret holds Caddy's own edge PKI (SERVER__CRT, the
        # environment's real public certificate), not the internal CA.
        #
        # ca.pem  -- Caddy as a *client*, for `tls_trust_pool file` when proxying
        #            to the trex/idp upstreams.
        # cert.pem/key.pem -- Caddy as a *server*, for the
        #            https://gateway.<ns>.svc.cluster.local site block. Internal
        #            callers (WebAPI fetching the advertised jwks_uri) dial the
        #            gateway by its cluster name, which SERVER__CRT does not
        #            cover; without a certificate for it Caddy aborts the
        #            handshake and WebAPI's OIDC bean fails to build.
        - name: d2e-tls
          secret:
            secretName: "{{ .Release.Name }}-{{ .Chart.Name }}"
            items:
              - key: TLS__INTERNAL__CA_CRT
                path: ca.pem
                mode: 0444
              - key: TLS__INTERNAL__CRT
                path: cert.pem
                mode: 0444
              # Owner-only: this is a private key, and Caddy runs as root here.
              - key: TLS__INTERNAL__KEY
                path: key.pem
                mode: 0400
