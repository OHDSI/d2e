apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}-caddy
  namespace: {{ .Release.Namespace }}
data:
  Caddyfile: |
    {
    	debug
        servers {
            protocols h1
        }
    	pki {
            ca local {
                name "ALP Local CA"
                root_cn "ALP Local CA - 2024 ECC Root"
            }
            ca alp-internal {
                name "ALP Internal CA"
                root_cn "ALP Internal CA - 2024 ECC Root"
                intermediate_cn "ALP Internal CA - ECC Intermediate"
            }
    	}
    }

    (proxy_headers_default) {
          header_up Host {$CADDY__D2E__PUBLIC_FQDN}
          header_up X-Forwarded-Host {$CADDY__D2E__PUBLIC_FQDN}
          header_up X-Forwarded-Port {$CADDY__D2E__PUBLIC_FQDN}
          header_up X-Forwarded-Proto https
          header_up X-Forwarded-For {remote}
    }

    (portal) {
        log {
            format console {
               level_format color
            }
        }

        @aliasbasepaths {
            path_regexp portal_basepath ^/(d2e|portal)(/)?$
        }
        redir @aliasbasepaths /d2e/portal

        # Logto api server
        @logto {
            path /api/*
            path /oidc/*
            path /sign-in
            path /consent
            path /callback/* # For azure connector
            
            path /d2e/logto/index.*
            path /d2e/logto/assets/* # logto assets are moved to this path
        }

        handle @logto {
            uri strip_prefix /d2e/logto
            reverse_proxy https://idp.{{ .Release.Namespace }}.svc.cluster.local {
            	header_up Host {$CADDY__D2E__PUBLIC_FQDN}
                header_up X-Forwarded-Host {$CADDY__D2E__PUBLIC_FQDN}
            	transport http {
                    tls
                    # The internal CA is not in Caddy's system pool -- the
                    # alpine image has no update-ca-certificates step -- so the
                    # trust pool has to name the mounted file explicitly.
                    # Without this the https:// upstream fails to verify.
                    tls_trust_pool file /etc/d2e/tls/ca.pem
                    read_buffer 8192
                }
            }
        }

        # Redirect uppercase /Atlas to lowercase /atlas
        @atlas_uppercase {
            path_regexp atlas_case ^/Atlas(.*)$$
        }
        redir @atlas_uppercase /atlas{re.atlas_case.1} 301

        @portalpath {
            path /d2e/portal/researcher/*
            path /d2e/portal/systemadmin/*
        }

        handle @portalpath {
            rewrite * /d2e/portal/index.html
            reverse_proxy https://{$TREX__D2E__INTERNAL_FQDN} {
                header_up Host {$CADDY__D2E__PUBLIC_FQDN}
            	transport http {
                    tls
                    tls_trust_pool file /etc/d2e/tls/ca.pem
            	}
            }
        }


        ## call gateway if there are no matched files
        handle {
            reverse_proxy https://{$TREX__D2E__INTERNAL_FQDN} {
                header_up Host {$CADDY__D2E__PUBLIC_FQDN}
                import proxy_headers_default
            	transport http {
                    tls
                    tls_trust_pool file /etc/d2e/tls/ca.pem
                    read_buffer 8192
            	}
            }
        }
    }

    https://{$CADDY__D2E__INTERNAL_FQDN} {
        tls /data/caddy/certificates/local/k8s.d2e.sg/k8s.d2e.sg.crt /data/caddy/certificates/local/k8s.d2e.sg/k8s.d2e.sg.key {
           issuer internal {
              ca local
           }
        }

        handle /check-liveness {
            respond "OK-FQDN"
        }

        handle /check-liveness* {
            respond "OK-FQDN"
        }

        import portal
    }

    :8080 {
        @oidc {
            path /oidc/*
        }
        handle @oidc {
            reverse_proxy https://idp.{{ .Release.Namespace }}.svc.cluster.local {
            	transport http {
                    tls
                    tls_trust_pool file /etc/d2e/tls/ca.pem
                }
            }
        }
        handle /check-liveness* {
            respond "OK-HTTP"
        }
        handle {
            respond 404
        }
    }

    # Internal callers reach the gateway by its in-cluster Service name over TLS.
    # Logto advertises jwks_uri as https://gateway.<ns>.svc.cluster.local/oidc/jwks
    # -- endpoint URLs follow the TLS hop into idp (and X-Forwarded-Proto https),
    # while `issuer` stays the plaintext ENDPOINT. WebAPI reads that jwks_uri and
    # dials it, so this name must be servable over 443.
    #
    # Without this block nothing on 443 matches the cluster name: the only other
    # https site is {$CADDY__D2E__INTERNAL_FQDN}, so Caddy finds no certificate
    # and aborts with an internal_error alert one message after Client Hello --
    # before any certificate is offered, which is why `curl -k` fails identically.
    # WebAPI then cannot build OidcAuthConfig$OpenidDirect, returns 500, and every
    # analytics-svc call that proxies to WebAPI 500s with it.
    #
    # It serves the internal certificate, not SERVER__CRT: SERVER__CRT is the
    # environment's real public certificate and has no reason to carry
    # cluster-internal SANs. (CI hides this by feeding the same self-signed cert
    # to both SERVER__CRT and TLS__INTERNAL__CRT, so its gateway happens to cover
    # the cluster name.) Routes mirror the :8080 block above so internal callers
    # get the same behaviour over either scheme.
    https://gateway.{{ .Release.Namespace }}.svc.cluster.local {
        tls /etc/d2e/tls/cert.pem /etc/d2e/tls/key.pem

        @oidc {
            path /oidc/*
        }
        handle @oidc {
            reverse_proxy https://idp.{{ .Release.Namespace }}.svc.cluster.local {
            	transport http {
                    tls
                    tls_trust_pool file /etc/d2e/tls/ca.pem
                }
            }
        }
        handle /check-liveness* {
            respond "OK-INTERNAL-TLS"
        }
        handle {
            respond 404
        }
    }

    https://localhost {
       tls {
            issuer internal {
                ca alp-internal
                lifetime 360d
                sign_with_root
            }
    	}
       handle /check-liveness {
          respond "OK-HTTPS"
       }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
data:
  CADDY__D2E__INTERNAL_FQDN: "{{ .Values.global.config.CADDY__D2E__INTERNAL_FQDN }}"
  CADDY__D2E__PUBLIC_FQDN: "{{ .Values.global.config.CADDY__D2E__PUBLIC_FQDN }}"
  CADDY__D2E__PUBLIC_FQDN_W_PROTOCOL: "https://{{ .Values.global.config.CADDY__D2E__PUBLIC_FQDN }}"
  LOGTO_ROLES_AZ_GROUPS_MAPPING: {{ .Values.global.idp.LOGTO_ROLES_AZ_GROUPS_MAPPING | quote }}


