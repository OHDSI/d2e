apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    profile: d2e-core
  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      profile: d2e-core
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        profile: d2e-core
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      restartPolicy: Always
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: NotIn
                values:
                - d2e
      volumes:
        # Logto terminates TLS on :3001/:3002 from this mounted pair (see
        # HTTPS_CERT_PATH on the logto container) and verifies its own outbound
        # calls against ca.pem via NODE_EXTRA_CA_CERTS. The key is 0400 because
        # it is the only private material here; the CA and cert are public.
        - name: d2e-tls
          secret:
            secretName: "{{ .Release.Name }}-{{ .Chart.Name }}"
            items:
              - key: TLS__INTERNAL__CA_CRT
                path: ca.pem
                mode: 0444
              - key: TLS__INTERNAL__CRT
                path: cert.pem
                mode: 0444
              - key: TLS__INTERNAL__KEY
                path: key.pem
                mode: 0400
      initContainers:
        - name: supabase-storage-pre-init
          env:
            - name: PGPORT
              value: "5432"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_HOST
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER_PASSWORD
          command: ["/bin/sh"]
          args:
            [
              "-c",
              "echo 'Creating role if not exists..' &&
               psql -c 'CREATE ROLE service_role NOLOGIN INHERIT;' || true &&
               echo 'Supabase Storage pre-initialization complete!' &&
               exit 0"
            ]
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi
        - name: supabase-storage-grant-roles
          env:
            - name: PGPORT
              value: "5432"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_HOST
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER_PASSWORD
            - name: POSTGRES_CONFIG_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_ADMIN_USER
            - name: POSTGRES_CONFIG_WRITE_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_WRITE_USER
          command: ["/bin/sh"]
          args:
            [
              '-c',
              'echo "Grant roles to users.." &&
               psql -c "GRANT service_role TO ${POSTGRES_CONFIG_ADMIN_USER};" &&
               psql -c "GRANT anon TO ${POSTGRES_CONFIG_WRITE_USER};" &&
               psql -c "GRANT authenticated TO ${POSTGRES_CONFIG_WRITE_USER};" &&
               echo "Supabase Storage roles assignment complete!" &&
               exit 0'
            ]
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi
        - name: logto-seed-init
          env:
            - name: DATABASE_CONNECTION_TIMEOUT
              value: "100000"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: IDP__JDBC__URL
          image: ghcr.io/ohdsi/d2e-logto:{{ .Values.global.image.tag }}
          imagePullPolicy: Always
          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              # Wait for trex to FINISH provisioning the database before seeding.
              # d2e-grants.mjs below grants on all tables in schema logto for the
              # logto_tenant_* roles, while trex's bootstrap grants on the same
              # tables for alp_pg_admin_user. Both rewrite the same
              # pg_class.relacl rows and Postgres has no lock that serialises
              # that, so running them concurrently loses one side to
              # "tuple concurrently updated" - and trex treats a provisioning
              # failure as fatal, so it aborts boot and never comes back.
              #
              # trex's health endpoint is the event to wait on: its provisioning
              # is a top-level await that exits non-zero on failure and the
              # express listener only starts afterwards, so a 200 implies the
              # bootstrap completed, on a fresh database and on a restart alike.
              # This init container is in a different Deployment from trex, so
              # nothing else orders the two.
              #
              # node is used deliberately: this image has neither curl nor wget.
              until node -e "
                const req = require('http').get('http://trex-http.{{ .Release.Namespace }}.svc.cluster.local:443/trex/_internal/health', (res) => {
                  res.resume();
                  process.exit(res.statusCode === 200 ? 0 : 1);
                });
                req.setTimeout(5000, () => req.destroy());
                req.on('error', () => process.exit(1));
              "; do
                echo "waiting for trex to finish provisioning the database ..."
                sleep 2
              done
              npm run cli db seed -- --swe && npm run cli db alteration deploy latest && node packages/core/d2e-grants.mjs
          resources:
            {{- toYaml .Values.global.resources.logtoSeedInit | nindent 12 }}
      containers:
        # - name: etl-copy
        #   command: ["tail"]
        #   volumeMounts:
        #     - mountPath: /data
        #       name: etl-volume
        #   args:
        #     [
        #       "-f",
        #       "/dev/null"
        #     ]
        #   image: mcr.microsoft.com/azure-cli:azurelinux3.0
        #   imagePullPolicy: IfNotPresent
        #   resources:
        #     requests:
        #       cpu: 100m
        #       memory: 100Mi
        #     limits:
        #       cpu: 2
        #       memory: 16000Mi
        - name: logto
          command: ["/bin/sh"]
          args: ["-c", "npm start"]
          env:
            - name: DATABASE_CONNECTION_TIMEOUT
              value: "60000"
            - name: ADMIN_DISABLE_LOCALHOST
              value: "false"
            # Scheme follows the listener: with HTTPS_CERT_PATH set below there
            # is no plaintext listener left on either port. (docker-compose
            # leaves ADMIN_ENDPOINT unset entirely and lets Logto derive it;
            # kept explicit here to preserve the chart's existing behaviour.)
            - name: ADMIN_ENDPOINT
              value: "https://localhost:3002"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: IDP__JDBC__URL
            - name: ENDPOINT
              value: "http://gateway.{{ .Release.Namespace }}.svc.cluster.local"
            - name: LOGTO_API_M2M_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO_API_M2M_CLIENT_ID
            - name: LOGTO_API_M2M_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO_API_M2M_CLIENT_SECRET
            - name: LOGTO_ROLES_AZ_GROUPS_MAPPING
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO_ROLES_AZ_GROUPS_MAPPING
            - name: NODE_ENV
              value: production
            - name: TLS__INTERNAL__DOMAIN
              value: {{ ((.Values.global).tls).internalDomain | default "d2e.local" | quote }}
            - name: TRUST_PROXY_HEADER
              value: "true"
            - name: PORT
              value: "3001"
            # Node reads its extra trust anchors from a file, so the mount alone
            # is enough -- no cert-writing entrypoint needed.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/d2e/tls/ca.pem
            # Logto terminates TLS natively on both :3001 and :3002 once these
            # point at a cert/key pair. Files come from the d2e-tls mount, so no
            # cert-writing shell is needed here either.
            - name: HTTPS_CERT_PATH
              value: /etc/d2e/tls/cert.pem
            - name: HTTPS_KEY_PATH
              value: /etc/d2e/tls/key.pem
            # Base URL the bundled connectors (alp-azuread, alp-entra-external-id)
            # use to call Logto's own API. They default to http://localhost:$PORT,
            # but with HTTPS_CERT_PATH set there is no plaintext listener left, so
            # those calls fail with ECONNRESET -- which only surfaces once a social
            # connector is configured. It must be a name the internal certificate
            # covers: `localhost` is not in the SAN, hence the service FQDN.
            # Verified against the internal CA via NODE_EXTRA_CA_CERTS above;
            # there is no verification bypass.
            - name: LOGTO__SELF_BASE_URL
              value: https://idp.{{ .Release.Namespace }}.svc.cluster.local:443
          image: ghcr.io/ohdsi/d2e-logto:{{ .Values.global.image.tag }}
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /etc/d2e/tls
              name: d2e-tls
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "sleep 30"]
          resources:
            {{- toYaml .Values.global.resources.logto | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/status
              port: 3001
              # :3001 now serves TLS. The kubelet does not verify the server
              # certificate for httpGet probes, so no CA reference is needed.
              scheme: HTTPS
            failureThreshold: 5
            initialDelaySeconds: 100
            periodSeconds: 5
            timeoutSeconds: 10
          ports:
            - containerPort: 3001
              protocol: TCP
            - containerPort: 3002
              protocol: TCP
