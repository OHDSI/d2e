                  key: TREX__SQL__PASSWORD
            - name: TREX__ENDPOINT_URL
              value: "http://localhost:33001"
            - name: TREX_ROUTES
              value: '{"d2e":"http://localhost:33001"}'
            - name: TREX_EXTENSIONS_PATH
              value: /usr/src/node_modules/@trex
            - name: TREX_POOL_SIZE
              value: "1024"
            - name: TREXSQL_ENABLED
              value: "true"
            - name: "PG_SCHEMA"
              value: "trexdb,notebook"
            - name: HADES_ENVS_BASE_DIR
              value: /data/hades/envs
            - name: HADES_OUTPUT_BASE_DIR
              value: /data/hades/runs
            - name: HADES_WORK_SCHEMA
              value: _config.work
            - name: SWARM_NODE
              value: d2e
            - name: SWARM_CONFIG
              value: |-
                {
                  "cluster_id": "d2e",
                  "nodes": {
                    "d2e": {
                      "gossip_addr": "0.0.0.0:4200",
                      "extensions": [
                        {
                          "name": "trexas",
                          "config": {
                            "host": "0.0.0.0",
                            "port": 33001,
                            "main_service_path": "/usr/src/core/server/index.eszip",
                            "event_worker_path": "/usr/src/core/event/index.eszip",
                            "tls_port": 33000,
                            "tls_cert_path": "/usr/src/cert/cert.pem",
