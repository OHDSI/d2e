apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    profile: d2e-functions
  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      profile: d2e-functions
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        profile: d2e-functions
    spec:
      nodeSelector:
        # "kubernetes.io/os": linux
        # "app": "d2e"
      restartPolicy: Always
      serviceAccountName: pod-viewer
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "d2e"
          effect: "NoExecute"
      volumes:
        - name: d2e-cm
          configMap:
            name: "{{ .Release.Name }}-{{ .Chart.Name }}"
        - name: trex-volume
          persistentVolumeClaim:
            claimName: trex-pvc
        - name: storage-volume
          persistentVolumeClaim:
            claimName: storage-pvc
        - name: atlas-db-init
          configMap:
            name: "{{ .Release.Name }}-{{ .Chart.Name }}-atlas-db-init"
        # Internal CA, delivered as a file the way caddy-local-pki already is.
        # Only the CA lands here: trex writes its own cert/key from
        # TLS__INTERNAL__* env, and nothing in this pod terminates TLS on the
        # mounted pair, so the private key stays out of the pod. 0444 because
        # every consumer must be able to read it whatever user it runs as -- a
        # CA certificate is public material.
        - name: d2e-tls
          secret:
            secretName: "{{ .Release.Name }}-{{ .Chart.Name }}"
            items:
              - key: TLS__INTERNAL__CA_CRT
                path: ca.pem
                mode: 0444
        {{- if .Values.features.materializeCohorts }}
        - name: materialize-cohorts-pki
          secret:
            secretName: "{{ .Release.Name }}-{{ .Chart.Name }}-materialize-cohorts"
        - name: materialize-cohorts-client-pki
          secret:
            secretName: "{{ .Release.Name }}-{{ .Chart.Name }}-materialize-cohorts-client"
        {{- end }}
      initContainers:
        # Fail fast on TLS material that is configured but unusable. A blank
        # secret key mounts as a zero-byte file, and each consumer then fails
        # separately and obscurely (PKIX / UnknownIssuer) with nothing naming the
        # real cause. Compose gets this from a FATAL guard in its entrypoints; in
        # Kubernetes an initContainer is the equivalent — it runs before every
        # container and depends on nothing in this pod, so it cannot deadlock.
        # Uses the trex image because trex is a container in this pod already:
        # no extra pull, no second tag to keep in step, and it has openssl.
        - name: tls-material-check
          image: ghcr.io/ohdsi/d2e-trex:{{ .Values.global.image.tag }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              f=/etc/d2e/tls/ca.pem
              if [ ! -s "$f" ]; then
                echo "FATAL: $f is empty or missing — check global.secrets.TLS__INTERNAL__CA_CRT" >&2
                exit 1
              fi
              if ! openssl x509 -in "$f" -noout >/dev/null 2>&1; then
                echo "FATAL: $f is not a valid PEM certificate — check global.secrets.TLS__INTERNAL__CA_CRT" >&2
                exit 1
              fi
              echo "internal CA present and parseable: $(openssl x509 -in "$f" -noout -subject)"
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
          volumeMounts:
            - mountPath: /etc/d2e/tls
              name: d2e-tls
              readOnly: true
        - name: trex-init
          image: busybox:latest
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 70m
              memory: 70Mi
          volumeMounts:
            - mountPath: /usr/src/data
              name: trex-volume
            - mountPath: /data/plugins/.npmrc
              name: d2e-cm
              subPath: TREX_NPMRC
            - mountPath: /data/plugins/bunfig.toml
              name: d2e-cm
              subPath: TREX_BUNFIG
            # - mountPath: /data/plugins/package.json
            #   name: d2e-cm
            #   subPath: TREX_PACKAGE_JSON_PLUGIN
          command: [
              "sh",
              "-c",
              "mkdir -p /usr/src/data/plugins && mkdir -p /usr/src/data/cache && \
              cp -rfv /data/plugins/.npmrc /usr/src/data/plugins/.npmrc && \
              cp -rfv /data/plugins/bunfig.toml /usr/src/data/plugins/bunfig.toml && exit 0",
            ]
        - name: logto-check
          image: busybox:latest
          resources:
            {{- toYaml .Values.global.resources.logtoCheck | nindent 12 }}
          volumeMounts:
            - mountPath: /etc/d2e/tls
              name: d2e-tls
              readOnly: true
          command:
            [
              "sh",
              "-c",
              "while :;do sleep 20 && wget --ca-certificate=/etc/d2e/tls/ca.pem -O success https://idp.{{ .Release.Namespace }}.svc.cluster.local:443/api/status && if test -f success; then exit 0; fi; done",
            ]
        - name: logto-post-init
          env:
            - name: CADDY__D2E__PUBLIC_FQDN
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: CADDY__D2E__PUBLIC_FQDN
            - name: ENV_TYPE
              value: remote
            - name: PG__DB_NAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: LOGTO__CONNECTOR_CONFIG
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__CONNECTOR_CONFIG
            - name: LOGTO__DISABLE_BASIC_AUTH
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__DISABLE_BASIC_AUTH
            - name: PG__HOST
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_HOST
            - name: PG__PORT
              value: "5432"
            - name: PG__SSL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: PG__SSL
            - name: PG__SCHEMA
              value: "logto"
            - name: PG__USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_IDP_ADMIN_USER
            - name: PG__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_IDP_ADMIN_PASSWORD
            - name: LOGTO__CUSTOM_JWT
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__CUSTOM_JWT
            - name: LOGTO_API_M2M_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO_API_M2M_CLIENT_ID
            - name: LOGTO_API_M2M_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO_API_M2M_CLIENT_SECRET
            - name: LOGTO__CLIENTID_PASSWORD__BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__CLIENTID_PASSWORD__BASIC_AUTH
            - name: IDP__ALP_SVC__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SVC_CLIENT_ID
            - name: IDP__ALP_SVC__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SVC_CLIENT_SECRET
            - name: IDP__ALP_APP__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__APP_CLIENT_ID
            - name: IDP__ALP_APP__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__APP_CLIENT_SECRET
            - name: IDP__ALP_DATA__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__DATA_CLIENT_ID
            - name: IDP__ALP_DATA__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__DATA_CLIENT_SECRET
            - name: IDP__ALP_DATA_CLIENT_ID
              value: $(IDP__ALP_DATA__CLIENT_ID)
            - name: LOGTO__CLIENT_APPS
              value: '[{"name":"alp-svc","description":"alp-svc","type":"MachineToMachine", "id": "$(IDP__ALP_SVC__CLIENT_ID)", "secret": "$(IDP__ALP_SVC__CLIENT_SECRET)"},{"name":"alp-data","description":"alp-data","type":"MachineToMachine", "id": "$(IDP__ALP_DATA__CLIENT_ID)", "secret": "$(IDP__ALP_DATA__CLIENT_SECRET)"},{"name":"alp-app","description":"alp-app","type":"Traditional", "id": "$(IDP__ALP_APP__CLIENT_ID)", "secret": "$(IDP__ALP_APP__CLIENT_SECRET)", "oidcClientMetadata":{"redirectUris":["https://$(CADDY__D2E__PUBLIC_FQDN)/d2e/portal/login-callback","https://$(CADDY__D2E__PUBLIC_FQDN)/d2e/ui/gateway/dashboard","https://$(CADDY__D2E__PUBLIC_FQDN)/WebAPI/user/oauth/callback/openid","https://$(CADDY__D2E__PUBLIC_FQDN)/atlas-login/"],"postLogoutRedirectUris":["https://$(CADDY__D2E__PUBLIC_FQDN)/d2e/portal"]},"customClientMetadata":{"corsAllowedOrigins":[],"refreshTokenTtlInDays":14,"alwaysIssueRefreshToken":true,"rotateRefreshToken":true}}]'
            - name: LOGTO__RESOURCE
              value: '{"name":"alp-default","indicator":"https://alp-default","accessTokenTtl":3600}'
            - name: LOGTO__USER
              value: '{"username":"admin","initialPassword":"Updatepassword12345"}'
            - name: LOGTO__ROLES
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__ROLES
            - name: LOGTO__SCOPES
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SCOPES
            - name: LOGTO__ROLES_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__ROLES_SCOPES
            - name: LOGTO__ADMIN_SERVER__FQDN_URL
              value: "https://idp-admin.{{ .Release.Namespace }}.svc.cluster.local:443"
            - name: LOGTO__ALP_ADMIN_APP
              value: '{"application": {"id": "$(LOGTO_API_M2M_CLIENT_ID)", "name":"alp-admin","description":"alp-admin", "secret": "$(LOGTO_API_M2M_CLIENT_SECRET)"}, "role": { "name":"api-access","description":"Logto API access"}}'
            - name: LOGTO__TERM_OF_USE_URL
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__TERM_OF_USE_URL
            - name: LOGTO__PRIVACY_POLICY_URL
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__PRIVACY_POLICY_URL
            - name: LOGTO__CUSTOM_CSS
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__CUSTOM_CSS
            # Node reads its extra trust anchors from a file, so the mount alone
            # is enough -- no entrypoint override needed to materialise the CA.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/d2e/tls/ca.pem

          image: ghcr.io/ohdsi/d2e-logto-post-init:{{ .Values.global.image.tag }}
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /etc/d2e/tls
              name: d2e-tls
              readOnly: true
          resources:
            {{- toYaml .Values.global.resources.logtoPostInit | nindent 12 }}
      containers:
        - name: dataflow-gen
          env:
            - name: PG__HOST
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_HOST
            - name: PG__USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER
            - name: PG__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER_PASSWORD
            - name: PG__DB_NAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: PREFECT_API_DATABASE_CONNECTION_URL
              value: postgresql+asyncpg://$(PG__USER):$(PG__PASSWORD)@$(PG__HOST):5432/$(PG__DB_NAME)
            - name: PREFECT_SERVER_API_BASE_PATH
              value: /d2e/api
            - name: PREFECT_UI_SERVE_BASE
              value: /d2e
            # Relative API URL: the UI calls whatever origin it was loaded
            # from, so API calls stay same-origin and avoid the cross-origin
            # CORS preflight that the in-container nginx answers with 503. Must
            # line up with PREFECT_SERVER_API_BASE_PATH above.
            - name: PREFECT_UI_API_URL
              value: /d2e/api
            - name: PREFECT_UI_URL
              value: https://127.0.0.1:41120/d2e
            - name: PREFECT_LOGGING_LEVEL
              value: DEBUG
            - name: PREFECT_LOGGING_SERVER_LEVEL
              value: WARNING
            # Prefect itself stays on loopback, HTTP only. nginx -- started by
            # the image entrypoint -- is the only thing listening on 41120,
            # terminating TLS with the shared TLS__INTERNAL__* cert and
            # proxying to 127.0.0.1:41121. The entrypoint hardcodes that
            # upstream, so these two values are load-bearing: leaving Prefect
            # on 0.0.0.0:41120 would collide with nginx.
            - name: PREFECT_SERVER_API_HOST
              value: 127.0.0.1
            - name: PREFECT_UI_STATIC_DIRECTORY
              value: /app/ui-files
            - name: PREFECT_SERVER_API_PORT
              value: "41121"
            - name: PREFECT_API_ENABLE_HTTP2
              value: "False"
            - name: PREFECT_API_DEFAULT_LIMIT
              value: "5000"
            - name: DB_CREDENTIALS_MGR__API_URL
              value: "https://trex.{{ .Release.Namespace }}.svc.cluster.local:443/db-credentials/db/"
            - name: DB_CREDENTIALS__PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: DB_CREDENTIALS__PRIVATE_KEY
            - name: IDP__ALP_SVC__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SVC_CLIENT_ID
            - name: IDP__ALP_SVC__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SVC_CLIENT_SECRET
            - name: IDP__SCOPE
              value: "https://alp-default"
            - name: IDP_SUBJECT_PROP
              value: "sub"
            # Read by the image entrypoint to write the nginx cert/key and set
            # server_name on the TLS listener.
            - name: TLS__INTERNAL__CRT
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TLS__INTERNAL__CRT
            - name: TLS__INTERNAL__KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TLS__INTERNAL__KEY
            - name: TLS__INTERNAL__CA_CRT
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TLS__INTERNAL__CA_CRT
            - name: DATAFLOW_GEN_HOSTNAME
              value: dataflow-gen.{{ .Release.Namespace }}.svc.cluster.local
          # No command/args override: the baked entrypoint writes the internal
          # cert, starts nginx (TLS on 41120 -> Prefect on loopback 41121),
          # then execs `prefect server start`. Overriding it would skip nginx
          # and leave the hop plaintext.
          #
          # This image is FROM prefecthq/prefect:3.6.10-python3.12 -- the same
          # base and version the chart ran directly -- plus nginx and that
          # entrypoint, so the swap changes no Prefect behaviour.
          image: ghcr.io/ohdsi/d2e-dataflow-gen:{{ .Values.global.image.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 41120
              protocol: TCP
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "sleep 120"]
          resources:
            {{- toYaml .Values.global.resources.dataflowGen | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /d2e/api/health
              port: 41120
              # nginx terminates TLS on 41120. The kubelet does not verify the
              # server certificate for httpGet probes, so no CA is needed.
              scheme: HTTPS
            failureThreshold: 5
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 20
          # nginx listens on 41120 before Prefect does, answering 502 in the gap.
          # httpGet treats anything outside 200-399 as failure, so this makes
          # "ready" mean "Prefect answers" rather than "nginx is up", and keeps
          # the dataflow-gen Service from routing to a container that would 502.
          # Note this gates Service endpoints only, not sibling containers in
          # this pod — trex's seeding waits via PrefectAPI.waitUntilReady().
          readinessProbe:
            httpGet:
              path: /d2e/api/health
              port: 41120
              scheme: HTTPS
            failureThreshold: 30
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        - name: trex
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /usr/src/cert
              printf '%s' "$TLS__INTERNAL__CRT" > /usr/src/cert/cert.pem
              (umask 077; printf '%s' "$TLS__INTERNAL__KEY" > /usr/src/cert/key.pem)
              # Three runtimes share this container and each finds its trust
              # anchors somewhere different. The OS store covers shell/curl and,
              # via DENO_TLS_CA_STORE=system, the Deno edge functions. GraalVM
              # WebAPI ignores the OS store entirely and reads WEBAPI_TRUST_CERTS.
              # All three are required: a pod-level curl check passes while the
              # other two runtimes still fail.
              cp /etc/d2e/tls/ca.pem /usr/local/share/ca-certificates/d2e-internal-ca.crt
              update-ca-certificates
              exec /usr/src/entrypoint.sh ${TREX_OTEL_ENABLED:+--enable-otel}
          env:
            - name: RUST_BACKTRACE
              value: "full"
            - name: ALP__SYSTEM_NAME
              value: Research System
            - name: APP__TENANT_ID
              value: {{ .Values.global.tenantId | quote }}
            - name: ACHILLES_THREAD_COUNT
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: ACHILLES_THREAD_COUNT
            - name: AUTO_GRANT_RESEARCHER_BY_DATASET_CODES
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: AZ_AUTO_GRANT_RESEARCHER_BY_DATASET_CODES
            - name: USER_MGMT__ROLE_SOURCE
              value: "logto"
            - name: NETWORK_COGNITO_DOMAIN
              value: ""
            - name: NETWORK_CENTRAL_API_URL
              value: ""
            - name: NETWORK_MACHINE_CLIENT_ID
              value: ""
            - name: NETWORK_TOKEN_SCOPE
              value: ""
            - name: NETWORK_COORDINATOR_CLIENT_ID
              value: ""
            - name: NETWORK_COORDINATOR_TOKEN_SCOPE
              value: ""
            - name: NETWORK_CLIENT_SECRET
              value: ""
            - name: NETWORK_ENC_KEY
              value: ""
            - name: NETWORK_COORDINATOR_CLIENT_SECRET
              value: ""
            - name: CADDY__D2E__PUBLIC_FQDN
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: CADDY__D2E__PUBLIC_FQDN
            - name: CUSTOM_WORK_POOL_CONFIGURATION
              value: {{ .Values.config.baseJobTemplate.configuration | toJson }}
            - name: CACHE_TABLE_LEVEL_CONCURRENCY
              value: "1"
            - name: CACHE_FLOW_LEVEL_CONCURRENCY
              value: "1"
            - name: CACHE_TASK_TIMEOUT
              value: "10800"
            - name: CACHE_CHUNK_TIMEOUT
              value: "3600"
            - name: DATABASE_CREDENTIALS
              value: "{}"
            - name: DB_CREDENTIALS_MGR__API_URL
              value: "https://trex.{{ .Release.Namespace }}.svc.cluster.local:443/db-credentials/db/"
            - name: EXCLUDE_ANALYSIS_IDS
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: EXCLUDE_ANALYSIS_IDS
            - name: HANA_HINT
              value: USE_HEX_PLAN
            - name: GATEWAY__IDP_AUTH_TYPE
              value: logto
            - name: GATEWAY__IDP_SUBJECT_PROP
              value: sub
            - name: GATEWAY__WO_PROTOCOL_FQDN
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: CADDY__D2E__PUBLIC_FQDN
            - name: DC_HANA_READ_ROLE
              value: ""
            - name: HOSTNAME
              value: "trex-http.{{ .Release.Namespace }}.svc.cluster.local"
            - name: LOGTO_API_M2M_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO_API_M2M_CLIENT_ID
            - name: LOGTO_API_M2M_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO_API_M2M_CLIENT_SECRET
            - name: IDP__ALP_SVC__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SVC_CLIENT_ID
            - name: LOGTO__SVC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SVC_CLIENT_ID
            - name: LOGTO__D2E_SVC__CLIENT_ID
              value: $(IDP__ALP_SVC__CLIENT_ID)
            - name: IDP__ALP_SVC__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SVC_CLIENT_SECRET
            - name: LOGTO__SVC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SVC_CLIENT_SECRET
            - name: LOGTO__D2E_SVC__CLIENT_SECRET
              value: $(IDP__ALP_SVC__CLIENT_SECRET)
            - name: LOGTO__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__APP_CLIENT_ID
            - name: LOGTO__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__APP_CLIENT_SECRET
            - name: LOGTO__D2E_DATA__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__DATA_CLIENT_ID
            - name: LOGTO__D2E_DATA__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__DATA_CLIENT_SECRET
            - name: IDP__ALP_SVC_CLIENT_ID
              value: $(IDP__ALP_SVC__CLIENT_ID)
            - name: IDP__ALP_DATA_CLIENT_ID
              value: $(LOGTO__D2E_DATA__CLIENT_ID)
            - name: IDP__ALP_ADMIN__RESOURCE
              value: https://default.logto.app/api
            - name: IDP__BASE_URL
              value: https://idp.{{ .Release.Namespace }}.svc.cluster.local:443
