                          "config": { "host": "0.0.0.0", "port": 5433, "password": "$(TREX__SQL__PASSWORD)" }
                        }
                      ]
                    }
                  }
                }
            - name: PLUGINS_API_VERSION
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: PLUGINS_API_VERSION
            - name: PLUGINS_REGISTRY
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: PLUGINS_REGISTRY
            - name: TPM_REGISTRY_URL
              value: "$(PLUGINS_REGISTRY)"
            - name: PLUGINS_IMAGE_TAG
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: PLUGINS_IMAGE_TAG
            - name: PLUGINS_PULL_POLICY
              value: Always
            - name: PLUGINS_FLOW_CUSTOM_REPO_IMAGE_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: PLUGINS_FLOW_CUSTOM_REPO_IMAGE_CONFIG
            - name: PG__DB_NAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: PG_DB_NAME
              value: "$(PG__DB_NAME)"
            - name: PG__DEBUG
              value: "1"
            - name: PG__DIALECT
              value: postgresql
            - name: PG__HOST
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_HOST
            - name: PG_HOST
              value: "$(PG__HOST)"
            - name: PG__IDLE_TIMEOUT_IN_MS
              value: "300000"
            - name: PG__MAX_POOL
              value: "10"
            - name: PG__MIN_POOL
              value: "0"
            - name: PG__PORT
              value: "5432"
            - name: PG_MANAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_ADMIN_PASSWORD
            - name: PG_ADMIN_PASSWORD
              value: "$(PG_MANAGE_PASSWORD)"
            - name: PG_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_ADMIN_USER
            - name: PG_MANAGE_USER
              value: "$(PG_ADMIN_USER)"
            - name: POSTGRES_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER
            - name: POSTGRES_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER_PASSWORD
            - name: PG__CONFIG__DB_NAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: PG_WRITE_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_WRITE_USER
            - name: PG_WRITE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_WRITE_PASSWORD
            # ── DB bootstrap (replaces the pg-mgmt-init initContainer) ────────
            # Same secret keys and the same $(VAR) expansion the retired
            # initContainer used. Order matters: kubelet only expands $(VAR) for
            # variables declared EARLIER in this list, so every reference below
            # is defined above it.
            - name: PG_LOGTO_MANAGER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_IDP_ADMIN_USER
            - name: PG_LOGTO_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_IDP_ADMIN_PASSWORD
            - name: POSTGRES_MANAGE_USERS
              value: |-
                {
                 "$(PG__DB_NAME)": {
                  "manager": "$(PG_ADMIN_USER)",
                  "managerPassword": "$(PG_ADMIN_PASSWORD)",
                  "reader": "$(PG_WRITE_USER)",
                  "readerPassword": "$(PG_WRITE_PASSWORD)",
                  "writer": "$(PG_WRITE_USER)",
                  "writerPassword": "$(PG_WRITE_PASSWORD)",
                  "logtoManager": "$(PG_LOGTO_MANAGER)",
                  "logtoManagerPassword": "$(PG_LOGTO_MANAGER_PASSWORD)"
                 }
                }
            - name: POSTGRES_MANAGE_CONFIG
              value: |-
                {
                 "databases": {
                  "+$(PG__DB_NAME)": {
                   "schemas": {
                    "+cdw_config": {}, "+jobplugins": {}, "+logto": {},
                    "+portal": {}, "+public": {}, "+qe_config": {},
                    "+terminology": {}, "+usermgmt": {}, "+files_manager": {},
                    "+perseus": {}, "+white_rabbit": {}, "+trex": {},
                    "+storage": {}, "+strategus": {}, "+notebook": {},
                    "+network": {}
                   }
                  }
                 }
                }
            - name: POSTGRES_MANAGE_ROLES_USERS
              value: "{}"
            - name: PG__SSL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: PG__SSL
            - name: PREFECT_API_URL
              value: https://dataflow-gen.{{ .Release.Namespace }}.svc.cluster.local:443/d2e/api
            - name: PREFECT_HEALTH_CHECK
              value: "https://dataflow-gen.{{ .Release.Namespace }}.svc.cluster.local:443/d2e/api/health"
            - name: PREFECT_POOL
              value: "process-pool"
            - name: WORKPOOL_TYPE
              value: "process"
            - name: DEFAULT_FLOW_COMMAND
              value: "/app/run-flow.sh d2e-flows"
            - name: STORAGE_FILE_BACKEND_PATH
              value: "/usr/src/data/storage"
            - name: TREX_STORAGE_URL
              value: "http://localhost:33001/plugins/trex/storage-api"
            - name: TREX_STORAGE_SERVICE_KEY
              value: ""
            - name: PROJECT_NAME
              value: d2e
            - name: SERVICE_ROUTES
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: SERVICE_ROUTES
            - name: DB_CREDENTIALS__PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: DB_CREDENTIALS__PUBLIC_KEYS
            - name: DB_CREDENTIALS__PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: DB_CREDENTIALS__PRIVATE_KEY
            - name: SUPABASE_STORAGE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: SUPABASE_STORAGE_JWT_SECRET
            - name: SUPABASE_STORAGE_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: SUPABASE_STORAGE_JWT_TOKEN
            - name: TLS__INTERNAL__CA_CRT
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TLS__INTERNAL__CA_CRT
            - name: TLS__INTERNAL__CRT
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TLS__INTERNAL__CRT
            - name: TLS__INTERNAL__DOMAIN
              value: {{ ((.Values.global).tls).internalDomain | default "d2e.local" | quote }}
            - name: TLS__INTERNAL__KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TLS__INTERNAL__KEY
            # The trexas worker HTTP client honors DENO_TLS_CA_STORE=system, so
            # the Deno edge functions trust the internal CA that this container's
            # args install into the OS store via update-ca-certificates.
            - name: DENO_TLS_CA_STORE
              value: system
            # Java analog of the above for the embedded native WebAPI. The GraalVM
            # libwebapi-native.so bakes its truststore at build time and ignores the
            # OS store, so WebApiNativeLibrary.start() reads this PEM at startup and
            # installs a composite SSLContext (JDK roots + the internal CA) before
            # Spring boots -- needed for OIDC discovery/JWKS over internal TLS.
            - name: WEBAPI_TRUST_CERTS
              value: /etc/d2e/tls/ca.pem
            - name: TREX__SQL__PORT
              value: "443"
            - name: TREX_SQL_PASSWORD
              value: "$(TREX__SQL__PASSWORD)"
            - name: JASYPT_ENCRYPTOR_ENABLED
              value: "false"
            - name: JASYPT_ENCRYPTOR_PASSWORD
              value: ""
            - name: JASYPT_ENCRYPTOR_ALGORITHM
              value: "PBEWITHSHA256AND256BITAES-CBC-BC"
            - name: TPM_USE_NODE_MODULES
              value: "false"
            - name: USE_PUBLIC_WEBAPI_PROXY
              value: "false"
            - name: USE_TREX_DB_CONN
              value: "false"
            - name: IS_AUDIT_LOG_ENABLED
              value: {{ .Values.features.auditLog | quote }}
            - name: IS_CDM_SQL_AUDIT_LOG_ENABLED
              value: {{ .Values.features.cdmSqlAuditLog | quote }}
            - name: AUDIT_LOG_TO_CONSOLE
              value: {{ .Values.features.auditLogToConsole | quote }}
            - name: ANALYTICS_HANA_STREAMING_ENABLED
              value: {{ .Values.features.materializeCohorts | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: STORAGE__JDBC__URL
            - name: TREX_ROOT_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TREX_ROOT_KEY
            - name: BETTER_AUTH_SECRET
              value: "$(TREX_ROOT_KEY)"
            - name: BETTER_AUTH_URL
              value: "http://localhost:33001/trex"
            - name: BASE_PATH
              value: /trex
            - name: SCHEMA_DIR
              value: /usr/src/core/schema
            - name: PLUGINS_DEV_PATH
              value: "/usr/src/plugins-dev:/usr/src/bundled-plugins"
            - name: D2E_COMPAT
              value: "true"
            - name: TREX_OTEL_ENABLED
              value: {{ (.Values.global.otel).enabled | default "" | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ (.Values.global.otel).exporterOtlpEndpoint | default "" | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ (.Values.global.otel).exporterOtlpProtocol | default "" | quote }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ (.Values.global.otel).exporterOtlpHeaders | default "" | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ (.Values.global.otel).serviceName | default "" | quote }}
            - name: ANALYTICS_STREAMING_CHUNK_SIZE_BY_DIALECT
              value: '{"hana": 10000}'
            - name: IS_SELF_MANAGED_ROLES
              value: "true"
          image: ghcr.io/ohdsi/d2e-trex:{{ .Values.global.image.tag }}
          imagePullPolicy: Always
          resources:
            requests:
              cpu: {{ .Values.resources.trex.requests.cpu }}
              memory: {{ .Values.resources.trex.requests.memory }}
            limits:
              cpu: {{ .Values.resources.trex.limits.cpu }}
              memory: {{ .Values.resources.trex.limits.memory }}        
          ports:
            - containerPort: 33000
              protocol: TCP
            - containerPort: 33001
              protocol: TCP
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/src/data
              name: trex-volume
            # WebAPI/Logto seeding SQL, applied by the d2e-compat atlas-db-init
            # block once webapi.sec_role and logto.users exist. Replaces the
            # webapi-init container, which ran the same files through psql.
            - mountPath: /usr/src/atlas-db-init
              name: atlas-db-init
            {{- if .Values.features.materializeCohorts }}
            - mountPath: /usr/src/cert/client.crt
              name: materialize-cohorts-client-pki
              subPath: API_COHORT_CLIENT_CRT
            - mountPath: /usr/src/cert/client.key
              name: materialize-cohorts-client-pki
              subPath: API_COHORT_CLIENT_KEY
            - mountPath: /usr/src/cert/ca.crt
              name: materialize-cohorts-client-pki
              subPath: API_TLS_CA
            {{- end }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fk https://localhost:33000/trex/_internal/health || curl -f http://localhost:33001/trex/_internal/health || exit 1
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
        {{- if .Values.features.materializeCohorts }}
        - name: materialize-cohorts
          command: ["npm", "run", "start"]
          env:
            - name: PORT
              value: "3333"
            - name: API_MTLS_ENABLED
              value: "true"
            - name: API_TLS_CA_PATH
              value: "/app/PKI/ca.crt"
            - name: API_TLS_CERT_PATH
              value: "/app/PKI/server.crt"
            - name: API_TLS_KEY_PATH
              value: "/app/PKI/server.key"
            - name: INSTALL_SQLALCHEMY_HANA
              value: "true"
          image: {{ .Values.global.images.materializeCohorts }}:{{ .Values.global.image.tag }}
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /app/PKI/ca.crt
              name: materialize-cohorts-pki
              subPath: API_TLS_CA
            - mountPath: /app/PKI/server.crt
              name: materialize-cohorts-pki
              subPath: API_TLS_CERT
            - mountPath: /app/PKI/server.key
              name: materialize-cohorts-pki
              subPath: API_TLS_KEY
          ports:
            - containerPort: 3333
              protocol: TCP
          resources:
            requests:
              # cpu: 100m
              cpu: 50m # for dev
              memory: 200Mi
            limits:
              cpu: 1000m
              memory: 2000Mi
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /health
              port: 3333
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
        {{- end }}
        - name: supabase-storage
          # Restore the image entrypoint ahead of the existing shell. It writes
          # the internal cert, installs the CA into the OS store, starts nginx
          # (TLS on 9000 -> storage-api on loopback 9001), then execs "$@" --
          # so the args below still run exactly as before.
          command: ["/usr/src/entrypoint.sh", "/bin/sh", "-c"]
          args:
            [
              "-c",
              "echo 'Waiting 60 seconds before starting...' && sleep 60 && echo 'Starting server now' && node dist/start/server.js",
            ]
          env:
            - name: PROJECT_REF
              value: "d2e"
            # storage-api moves off 9000 so nginx can own it. Resolution order
            # in the image's config is SERVER_HOST || HOST and
            # SERVER_PORT || PORT, and the baked nginx.conf proxies to
            # 127.0.0.1:9001, so all three must agree.
            - name: PORT
              value: "9001"
            - name: SERVER_HOST
              value: 127.0.0.1
            - name: SERVER_PORT
              value: "9001"
            - name: FILE_SIZE_LIMIT
              value: "1048576000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: STORAGE__JDBC__URL
            - name: SUPABASE_STORAGE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: SUPABASE_STORAGE_JWT_SECRET
            - name: PGRST_JWT_SECRET
              value: "$(SUPABASE_STORAGE_JWT_SECRET)"
            - name: SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: SUPABASE_STORAGE_JWT_TOKEN
            - name: MIGRATIONS_SCHEMA
              value: storage
            - name: MIGRATIONS_TABLE
              value: migrations
            - name: SKIP_MIGRATIONS
              value: "true"
            - name: STORAGE_BACKEND
              value: file
            - name: GLOBAL_S3_BUCKET
              value: stub
            # Inert under STORAGE_BACKEND=file, but kept consistent: the
            # endpoint has to be a name the internal certificate covers if the
            # S3 backend ever goes live.
            - name: GLOBAL_S3_ENDPOINT
              value: https://storage.{{ .Release.Namespace }}.svc.cluster.local:443/s3
            - name: GLOBAL_S3_PROTOCOL
              value: https
            - name: GLOBAL_S3_FORCE_PATH_STYLE
              value: "true"
            - name: FILE_STORAGE_BACKEND_PATH
              value: "/var/lib/storage"
            - name: TENANT_ID
              value: "stub"
            - name: REGION
              value: stub
            # Read by the image entrypoint to write the nginx cert/key and to
            # install the CA into this container's OS trust store.
            - name: TLS__INTERNAL__CRT
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TLS__INTERNAL__CRT
            - name: TLS__INTERNAL__KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TLS__INTERNAL__KEY
            - name: TLS__INTERNAL__CA_CRT
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TLS__INTERNAL__CA_CRT
          image: ghcr.io/ohdsi/d2e-supabase-storage:{{ .Values.global.image.tag }}
          volumeMounts:
            - name: storage-volume
              mountPath: /var/lib/storage
            - mountPath: /etc/d2e/tls
              name: d2e-tls
              readOnly: true
          imagePullPolicy: IfNotPresent
          # nginx now owns :9000 with TLS, so both probes move to https. They
          # stay on loopback and skip validation, matching compose and trex's
          # own probe: these must not route through the Service (a readiness
          # probe that does can never pass, since the Service has no ready
          # endpoints until the probe succeeds), and no certificate can cover
          # 127.0.0.1 without an IP SAN. The CA chain on this listener is
          # exercised for real by in-cluster callers.
          livenessProbe:
            exec:
              command:
                - wget
                - --no-check-certificate
                - -O
                - liveness
                - https://127.0.0.1:9000/status
            failureThreshold: 5
            initialDelaySeconds: 150
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - wget
                - --no-check-certificate
                - -O
                - readiness
                - https://127.0.0.1:9000/status
            failureThreshold: 5
            initialDelaySeconds: 150
            periodSeconds: 5
            timeoutSeconds: 10
          ports:
            - containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 500Mi
