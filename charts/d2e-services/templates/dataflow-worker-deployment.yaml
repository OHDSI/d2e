apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    profile: d2e-dataflow-worker
  name: "{{ .Release.Name }}-{{ .Chart.Name }}-dataflow-worker"
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      profile: d2e-dataflow-worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        profile: d2e-dataflow-worker
    spec:
      serviceAccountName: dataflow-gen-svc-acc
      restartPolicy: Always
      # nodeSelector:
      #   "kubernetes.io/os": linux
      #   "system": "d2e"
      # tolerations:
      #   - key: "app"
      #     operator: "Equal"
      #     value: "d2e"
      #     effect: "NoExecute"
      # volumes:
      #   - name: trex-volume
      #     persistentVolumeClaim:
      #       claimName: trex-pvc
      initContainers:
        - name: dependencies-check
          # Not busybox: its wget has no --ca-certificate, only the
          # --no-check-certificate bypass. The worker image is already pulled for
          # this pod and ships curl (see its Dockerfile), which verifies chain and
          # hostname by default.
          image: ghcr.io/ohdsi/d2e-dataflow-gen-worker:{{ .Values.global.image.tag }}
          command:
            [
              "sh",
              "-c",
              "until curl -sf --cacert /etc/d2e/tls/ca.pem https://trex.{{ .Release.Namespace }}.svc.cluster.local:443/trex/_internal/health >/dev/null && curl -sf --cacert /etc/d2e/tls/ca.pem https://dataflow-gen.{{ .Release.Namespace }}.svc.cluster.local:443/d2e/api/health >/dev/null; do echo 'waiting for trex and dataflow-gen ...'; sleep {{ .Values.dataflowWorker.readinessSleep }}; done",
            ]
          volumeMounts:
            - mountPath: /etc/d2e/tls
              name: d2e-tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 100Mi
        - name: supabase-storage-post-init
          env:
            - name: PGPORT
              value: "5432"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_HOST
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_ADMIN_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_ADMIN_PASSWORD
          command: ["/bin/sh"]
          args:
            [
              "-c",
              "echo 'Updating public.objects view to include user_metadata column...' &&
               psql -c 'ALTER TABLE IF EXISTS storage.objects DISABLE ROW LEVEL SECURITY;' &&
               psql -c 'DROP VIEW IF EXISTS public.objects CASCADE;' &&
               psql -c 'CREATE VIEW public.objects AS SELECT * FROM storage.objects;' &&
               psql -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON public.objects TO service_role;' &&
               psql -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON public.objects TO authenticated;' &&
               psql -c 'GRANT SELECT ON public.objects TO anon;' &&
               echo 'Supabase Storage post-initialization complete!' &&
               exit 0"
            ]
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi
        - name: dataflow-gen-post-init
          env:
            - name: PG__HOST
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_HOST
            - name: PG__USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER
            - name: PG__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_SUPERUSER_PASSWORD
            - name: PG__DB_NAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: PREFECT_API_DATABASE_CONNECTION_URL
              value: postgresql+asyncpg://$(PG__USER):$(PG__PASSWORD)@$(PG__HOST):5432/$(PG__DB_NAME)
            - name: PREFECT_LOGGING_LEVEL
              value: DEBUG
            - name: PREFECT_LOGGING_SERVER_LEVEL
              value: WARNING
          command: ["/bin/sh"]
          args: ["-c", "prefect server database upgrade -y"]
          image: prefecthq/prefect:3.6.10-python3.12
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 200Mi
          ports:
            - containerPort: 41120
              protocol: TCP
      volumes:
        - name: d2e-worker-cm
          configMap:
            name: "{{ .Release.Name }}-{{ .Chart.Name }}"
        # Internal CA only: nothing in this pod terminates TLS, so the private
        # key stays out. 0444 because a CA certificate is public material and
        # every consumer must be able to read it whatever user it runs as.
        - name: d2e-tls
          secret:
            secretName: "{{ .Release.Name }}-{{ .Chart.Name }}"
            items:
              - key: TLS__INTERNAL__CA_CRT
                path: ca.pem
                mode: 0444
      containers:
        - name: dataflow-gen-worker
          env:
            - name: D2E_MEMORY_LIMIT
              value: "1G"
            - name: D2E_SWAP_LIMIT
              value: "4G"
            - name: D2E_DUCKDB_MEMORY_LIMIT
              value: {{ .Values.dataflowWorker.duckdb.memoryLimit | quote }}
            - name: D2E_DUCKDB_THREADS
              value: {{ .Values.dataflowWorker.duckdb.threads | quote }}
            - name: DOCKER_REGISTRY_URL
              value: {{ .Values.global.dockerRegistryUrl | quote }}
            - name: NODE_ENV
              value: development
            - name: DATAFLOW_MGMT__FLOWS__RESULTS_SB_NAME
              value: flow-results
            - name: DATAFLOW_MGMT__FLOWS__RESULTS__S3_DIR_PATH
              value: s3://flows/results
            - name: R_LIBS_USER
              value: /home/docker/plugins/R/site-library
            - name: IDP__ALP_DATA__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__DATA_CLIENT_ID
            - name: IDP__ALP_DATA__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__DATA_CLIENT_SECRET
            - name: DUCKDB__DATA_FOLDER
              value: /app/duckdb_data
            - name: CDW_CONFIG_DUCKDB__DATA_FOLDER
              value: /app/cdw-config/duckdb_data
            - name: ALP__SYSTEM_ID
              value: alp-research
            - name: OHDSI__R_COHORT_GENERATOR_MODULE_SETTINGS_URL
              value: https://raw.githubusercontent.com/OHDSI/CohortGeneratorModule/v0.3.0/SettingsFunctions.R
            - name: OHDSI__R_COHORT_DIAGNOSTICS_MODULE_SETTINGS_URL
              value: https://raw.githubusercontent.com/OHDSI/CohortDiagnosticsModule/v0.2.0/SettingsFunctions.R
            - name: FHIR_SCHEMA_JSON_PATH
              value: /home/docker/fhir
            - name: ACHILLES_THREAD_COUNT
              value: "5"
            - name: PG__HOST
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_HOST
            - name: PG__USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_ADMIN_USER
            - name: PG__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_ADMIN_PASSWORD
            - name: PG__DB_NAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: POSTGRES_CONFIG_DB
            - name: PREFECT_API_DATABASE_CONNECTION_URL
              value: postgresql+asyncpg://$(PG__USER):$(PG__PASSWORD)@$(PG__HOST):5432/$(PG__DB_NAME)
            - name: PREFECT_API_URL
              value: https://dataflow-gen.{{ .Release.Namespace }}.svc.cluster.local:443/d2e/api
            - name: INSTALL_SQLALCHEMY_HANA
              value: "true"
            - name: TREX_STORAGE_URL
              value: "https://trex.{{ .Release.Namespace }}.svc.cluster.local:443/plugins/trex/storage-api"
            - name: TREX_STORAGE_SERVICE_KEY
              value: ""
            - name: PREFECT_API_ENABLE_HTTP2
              value: "False"
            - name: PREFECT_WORKER_WEBSERVER_HOST
              value: "0.0.0.0"
            - name: PREFECT_TASKS_CACHE_ENABLED
              value: "false"
            - name: PREFECT_FLOW_RUN_CACHE_ENABLED
              value: "false"
            - name: PREFECT_RESULTS_PERSIST_BY_DEFAULT
              value: "false"
            - name: PREFECT_EVENTS_ENABLED
              value: "false"
            - name: DB_CREDENTIALS_MGR__API_URL
              value: "https://trex.{{ .Release.Namespace }}.svc.cluster.local:443/db-credentials/db/"
            - name: DOCKER_REGISTRY_USERNAME
              value: dummy
            - name: DOCKER_REGISTRY_PASSWORD
              value: ""
            - name: DB_CREDENTIALS__PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: DB_CREDENTIALS__PRIVATE_KEY
            - name: IDP__ALP_SVC__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SVC_CLIENT_ID
            - name: IDP__ALP_SVC__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: LOGTO__SVC_CLIENT_SECRET
            - name: IDP__SCOPE
              value: "https://alp-default"
            - name: IDP_SUBJECT_PROP
              value: "sub"
            - name: SERVICE_ROUTES
              valueFrom:
                configMapKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: SERVICE_ROUTES
            - name: TLS__INTERNAL__CA_CRT
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TLS__INTERNAL__CA_CRT
            # cohort_discovery: Hutch Relay Task API connection, shared across
            # every dataset's poller runs
            - name: TASK_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TASK_API_BASE_URL
            - name: TASK_API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TASK_API_USERNAME
            - name: TASK_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-{{ .Chart.Name }}"
                  key: TASK_API_PASSWORD
            - name: TASK_API_TYPE
              value: "a"
            - name: TASK_API_ENFORCE_HTTPS
              value: "true"
            - name: LOW_NUMBER_SUPPRESSION_THRESHOLD
              value: "10"
            - name: ROUNDING_TARGET
              value: "10"
            # Trust the internal self-signed CA across every Python HTTP stack,
            # matching docker-compose (alp-dataflow-gen-worker). The args above
            # put the CA into the OS bundle; these point urllib/requests/httpx at
            # that bundle. Without them only clients that explicitly pass
            # certifi.where() are covered -- stdlib urlopen (run-flow.sh's
            # deployment lookup) and websockets (the prefect events subscriber)
            # read OpenSSL's defaults, which under `pixi run` resolve inside the
            # env prefix (<env>/ssl/cert.pem) and never see the CA. Flows also
            # exec in their own per-plugin pixi env provisioned at run time, so a
            # startup-time append to this env's certifi cannot reach them; an
            # inherited env var can.
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
          command:
            - /entrypoint.sh
            - pixi
            - run
            - --manifest-path
            - /opt/worker/pyproject.toml
            - sh
            - -c
          args:
            - >-
              rm -rf /root/.prefect/storage/run_cache.db /root/.prefect/storage/events.db;
              if [ ! -s /etc/d2e/tls/ca.pem ]; then echo "FATAL: /etc/d2e/tls/ca.pem is missing or empty -- the d2e-tls volume is not mounted, or global.secrets.TLS__INTERNAL__CA_CRT is empty. Refusing to start without the internal trust anchor." >&2; exit 1; fi;
              grep -q '^-----BEGIN CERTIFICATE-----$' /etc/d2e/tls/ca.pem || { echo "FATAL: /etc/d2e/tls/ca.pem is not a PEM certificate. Refusing to start untrusted." >&2; exit 1; };
              cp /etc/d2e/tls/ca.pem /usr/local/share/ca-certificates/d2e-internal-ca.crt || { echo "FATAL: could not install the internal CA into the OS trust store." >&2; exit 1; };
              update-ca-certificates;
              openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt /etc/d2e/tls/ca.pem >/dev/null 2>&1 || { echo "FATAL: the internal CA is not present in /etc/ssl/certs/ca-certificates.crt after update-ca-certificates. SSL_CERT_FILE/REQUESTS_CA_BUNDLE point at that bundle, so every Python HTTP stack would fail verification. Refusing to start untrusted." >&2; exit 1; };
              python -c 'import certifi; open(certifi.where(), "a").write("\n" + open("/etc/d2e/tls/ca.pem").read() + "\n")';
              prefect work-pool create "${PREFECT_POOL:-process-pool}" --type ${WORKPOOL_TYPE:-process};
              prefect worker start --pool "${PREFECT_POOL:-process-pool}" --type ${WORKPOOL_TYPE:-process}
              --name prefect-${WORKPOOL_TYPE:-process}-worker --with-healthcheck
              --limit {{ .Values.dataflowWorker.flowRunLimit | default 3 }}
          image: ghcr.io/ohdsi/d2e-dataflow-gen-worker:{{ .Values.global.image.tag }}
          imagePullPolicy: Always
          volumeMounts:
            - mountPath: /opt/prefect/libs/baseJobTemplate.json
              name: d2e-worker-cm
              subPath: baseJobTemplate.json
            - mountPath: /etc/d2e/tls
              name: d2e-tls
              readOnly: true
          resources:
            {{- toYaml .Values.global.resources.dataflowGenWorker | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pixi
                - run
                - --manifest-path
                - /opt/worker/pyproject.toml
                - python
                - -c
                - "import urllib.request, sys; sys.exit(0 if 200 <= urllib.request.urlopen('http://localhost:8080/health', timeout=5).getcode() < 300 else 1)"
            failureThreshold: 5
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 30
        