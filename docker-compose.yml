name: ${PROJECT_NAME:-d2e}
networks:
  alp:
  data:

volumes:
  caddy:
  cdw-config-cachedb-data-1:
  minio-data-1:
  pg-minerva-data-1:
  r-libs:
  trex:
  demodb-data:
  hana-data:
  supabase-storage-data:
  hades-data:
  audit-logs:

x-envs:
  env_converter: &x-converter
    URL__DATABASE_LIST__GET: http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/gateway/api/db/database-creds/
    DB_CREDENTIALS__PRIVATE_KEY: ${DB_CREDENTIALS__INTERNAL__DECRYPT_PRIVATE_KEY}
    IDP__ALP_SVC__CLIENT_ID: ${LOGTO__D2E_SVC__CLIENT_ID:-${LOGTO__ALP_SVC__CLIENT_ID}}
    IDP__ALP_SVC__CLIENT_SECRET: ${LOGTO__D2E_SVC__CLIENT_SECRET:-${LOGTO__ALP_SVC__CLIENT_SECRET}}
    IDP__SCOPE: https://alp-default
    IDP_SUBJECT_PROP: sub
  pg: &x-pg
    PG__DB_NAME: alp
    ## Flag to display executed Knex queries in log
    PG__DEBUG: ${PG_DEBUG:-1}
    PG__HOST: ${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}
    PG__MAX_POOL: ${PG__MAX_POOL:-1}
    PG__MIN_POOL: ${PG__MIN_POOL:-1}
    PG__PORT: ${PG_PORT:-5432}
    PG__IDLE_TIMEOUT_IN_MS: ${PG__IDLE_TIMEOUT_IN_MS:-30000}
    PG__DIALECT: postgresql
    PG__SSL: ${PG__SSL:-false}
  trex_sql: &x-trex-sql
    TREX__SQL__HOST: ${PROJECT_NAME:-d2e}-trex
    TREX__SQL__PORT: ${TREX__SQL__PORT:-5433}
    TREX__SQL__USER: postgres
    TREX__SQL__PASSWORD: ${TREX__SQL__PASSWORD:?TREX__SQL__PASSWORD must be set (run d2e init); refusing default pencil} # Password for the trex sql interface
    TREX__SQL__DBNAME: postgres
  # "https://${PROJECT_NAME:-d2e}-minerva-portal-server-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:41105",
  tls: &x-tls
    TLS__INTERNAL__CA_CRT: ${TLS__INTERNAL__CA_CRT}
    TLS__INTERNAL__CRT: ${TLS__INTERNAL__CRT}
    TLS__INTERNAL__DOMAIN: ${TLS__INTERNAL__DOMAIN:-d2e.local}
    TLS__INTERNAL__KEY: ${TLS__INTERNAL__KEY}

services:
  # OHDSI WebAPI for Atlas3 (with trex dependencies)
  trex:
    image: ${DOCKER_IMAGE_PREFIX:-ghcr.io/ohdsi/}d2e-trex:${DOCKER_TAG_NAME:-develop}
    container_name: ${PROJECT_NAME:-d2e}-trex
    hostname: ${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}
    extra_hosts:
      - "${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}:host-gateway"
    depends_on:
      # trex now provisions the database itself (runD2eBootstrap), so it only
      # needs Postgres up. It deliberately does NOT wait for alp-logto-post-init
      # any more: logto cannot migrate until trex has created logto_postgres and
      # the logto schema, so trex must start FIRST. Keeping the old edge would
      # deadlock (trex -> post-init -> logto -> trex's bootstrap).
      alp-minerva-postgres:
        condition: service_healthy
    networks:
      alp:
        priority: 20
      data:
        priority: 10
    volumes:
      - trex:/usr/src/data
      - cdw-config-cachedb-data-1:/usr/src/cdw_data/dynamically_generated
      - hades-data:/data/hades
      - audit-logs:/var/log/d2e/audit
      # `notebook` schema (studies/notebooks) + its PostGraphile grants, applied
      # as a trex migrations plugin. Must land under a PLUGINS_DEV_PATH entry to
      # be scanned; trex runs it against _config (the alp Postgres catalog) and
      # tracks applied versions in notebook.refinery_schema_history.
      - ./services/trex/migrations/notebook:/usr/src/bundled-plugins/notebook-schema:ro
      # d2e's DB provisioning (login users, supabase roles, schemas, grants),
      # applied as a trex provision plugin BEFORE any other plugin loads.
      # Already baked into the image; mounted so a source edit takes effect on
      # restart without a rebuild.
      - ./services/trex/provision/d2e-bootstrap:/usr/src/bundled-plugins/d2e-bootstrap:ro
      # WebAPI/Logto seeding SQL, applied by the d2e-compat atlas-db-init block
      # once webapi.sec_role and logto.users exist. Replaces the webapi-init
      # container, which ran the same files through psql.
      - ./services/atlas-db-init:/usr/src/atlas-db-init:ro
    ports:
      - "8090:8080"
    healthcheck:
      # trex's main mounts built-in routes under BASE_PATH (=/trex), so the
      # internal health endpoint is /trex/_internal/health. (D2E_COMPAT routes
      # like /WebAPI and /portal are mounted at root, separately.)
      test: ["CMD-SHELL", "curl -fk https://localhost:33000/trex/_internal/health || curl -f http://localhost:33001/trex/_internal/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        mkdir -p /usr/src/cert
        printf '%s' "$$TLS__INTERNAL__CRT" > /usr/src/cert/cert.pem
        (umask 077; printf '%s' "$$TLS__INTERNAL__KEY" > /usr/src/cert/key.pem)
        printf '%s' "$$TLS__INTERNAL__CA_CRT" > /usr/src/cert/ca.pem
        cp /usr/src/cert/ca.pem /usr/local/share/ca-certificates/d2e-internal-ca.crt
        # Optional additional trust anchors, for upstreams that are not ours — the
        # PS config server is typically external/HANA-side with its own CA. This is
        # the supported way to reach such a server: the edge-function shim has no
        # per-request TLS control and there is no verification bypass.
        #
        # Accepts one or more concatenated PEM blocks, split into one file each:
        # update-ca-certificates appends a whole file to the bundle but only hashes
        # its FIRST certificate into the CApath symlinks, so a multi-cert file would
        # be trusted by bundle readers and silently ignored by CApath readers.
        # The value needs real newlines; a .env-style string with literal \n will
        # not parse, so the count is asserted below rather than failing later at
        # the first TLS call.
        if [ -n "$${TLS__EXTRA__CA_CRTS:-}" ]; then
          printf '%s\n' "$$TLS__EXTRA__CA_CRTS" |
            awk 'BEGIN{n=0} /^-----BEGIN CERTIFICATE-----$$/{n++} n>0{print > ("/usr/local/share/ca-certificates/d2e-extra-ca-" n ".crt")}'
          got=0
          for f in /usr/local/share/ca-certificates/d2e-extra-ca-*.crt; do
            [ -e "$$f" ] || continue
            if grep -qx -- '-----END CERTIFICATE-----' "$$f"; then
              got=$$((got + 1))
            else
              echo "FATAL: $$f has no END line; TLS__EXTRA__CA_CRTS is truncated or malformed" >&2
              exit 1
            fi
          done
          if [ "$$got" -eq 0 ]; then
            echo "FATAL: TLS__EXTRA__CA_CRTS is set but contains no PEM certificate. It needs real newlines -- a .env-style value with literal \\n will not parse." >&2
            exit 1
          fi
          echo "installed $$got extra CA certificate(s)"
        fi
        update-ca-certificates
        # This command replaces the image's own CMD, so the --enable-otel flag
        # from Dockerfile.v2 never runs here; it must be re-added to this exec.
        exec /usr/src/entrypoint.sh $${TREX_OTEL_ENABLED:+--enable-otel}
    restart: ${DOCKER__RESTART_POLICY:-unless-stopped}
    environment:
      <<:
        - *x-converter
        - *x-tls
        - *x-pg
        - *x-trex-sql
      # With the rebuilt trexas runtime (cert_provider fix), the worker HTTP client
      # honors DENO_TLS_CA_STORE=system, so it trusts the internal CA installed into
      # the OS store by the command above (via update-ca-certificates).
      DENO_TLS_CA_STORE: system
      # Extra trust anchors for non-internal upstreams (e.g. an external PS config
      # server with its own CA). One or more concatenated PEM blocks; installed into
      # the OS store by the command above, so DENO_TLS_CA_STORE=system picks them up.
      TLS__EXTRA__CA_CRTS: ${TLS__EXTRA__CA_CRTS:-}
      # Java analog of DENO_TLS_CA_STORE for the embedded native WebAPI. The GraalVM
      # libwebapi-native.so bakes its truststore at build time and ignores the OS store
      # (update-ca-certificates), so WebApiNativeLibrary.start() reads this PEM at startup
      # and installs a composite SSLContext (JDK roots + this internal CA) before Spring
      # boots — needed for OIDC discovery/JWKS over the internal self-signed TLS. The file
      # is written by this service's command above (line ~115).
      WEBAPI_TRUST_CERTS: /usr/src/cert/ca.pem
      # Plugin paths for trex - must match volume mount at /usr/src/data
      PLUGINS_PATH: /usr/src/data/plugins
      DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      DATASOURCE_URL: jdbc:postgresql://alp-minerva-postgres:5432/alp?currentSchema=webapi
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: ${PG_SUPER_PASSWORD}
      DATASOURCE_OHDSI_SCHEMA: webapi
      JASYPT_ENCRYPTOR_ENABLED: ${JASYPT_ENCRYPTOR_ENABLED:-false}
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:-}
      JASYPT_ENCRYPTOR_ALGORITHM: ${JASYPT_ENCRYPTOR_ALGORITHM:-PBEWITHSHA256AND256BITAES-CBC-BC}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: webapi
      SPRING_BATCH_REPOSITORY_TABLEPREFIX: webapi.batch_
      # Flyway migration settings
      FLYWAY_DATASOURCE_USERNAME: postgres
      FLYWAY_DATASOURCE_PASSWORD: ${PG_SUPER_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://alp-minerva-postgres:5432/alp?currentSchema=webapi
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: ${PG_SUPER_PASSWORD}
      SPRING_FLYWAY_SCHEMAS: webapi
      SPRING_FLYWAY_TABLE: flyway_schema_history
      SPRING_FLYWAY_PLACEHOLDERS_OHDSISCHEMA: webapi
      # No SPRING_FLYWAY_BASELINE_VERSION: on an empty schema Flyway baselines at v1
      # and applies all migrations, including the early ones that create cc_* tables.
      # Existing installs already have history rows so this is a no-op for them.
      # Security configuration
      SECURITY_PROVIDER: AtlasRegularSecurity
      SECURITY_ORIGIN: "*"
      SECURITY_SSL_ENABLED: "false"
      # Enable forwarded headers support for reverse proxy
      SERVER_FORWARD_HEADERS_STRATEGY: NATIVE
      # Auth providers - OpenID via Logto + Database auth
      SECURITY_AUTH_JDBC_ENABLED: "true"
      SECURITY_AUTH_WINDOWS_ENABLED: "false"
      SECURITY_AUTH_KERBEROS_ENABLED: "false"
      SECURITY_AUTH_OIDC_ENABLED: "true"
      SECURITY_AUTH_FACEBOOK_ENABLED: "false"
      SECURITY_AUTH_GITHUB_ENABLED: "false"
      SECURITY_AUTH_GOOGLE_ENABLED: "false"
      SECURITY_AUTH_LDAP_ENABLED: "false"
      SECURITY_AUTH_AD_ENABLED: "false"
      SECURITY_AUTH_CAS_ENABLED: "false"
      # Database authentication configuration (uses webapi_security schema in alp-minerva-postgres)
      SECURITY_DB_DATASOURCE_SCHEMA: webapi_security
      SECURITY_DB_DATASOURCE_URL: "jdbc:postgresql://alp-minerva-postgres:5432/alp?currentSchema=webapi_security"
      SECURITY_DB_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SECURITY_DB_DATASOURCE_USERNAME: postgres
      SECURITY_DB_DATASOURCE_PASSWORD: ${PG_SUPER_PASSWORD}
      SECURITY_DB_DATASOURCE_AUTHENTICATIONQUERY: "SELECT password, email AS firstname, NULL AS middlename, email AS lastname FROM webapi_security.security WHERE email = ?"
      # Native WebAPI reads its auth datasource under security.auth.db.datasource.*
      # (not the legacy security.db.datasource.* above).
      SECURITY_AUTH_DB_ENABLED: "true"
      SECURITY_AUTH_DB_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SECURITY_AUTH_DB_DATASOURCE_URL: "jdbc:postgresql://alp-minerva-postgres:5432/alp?currentSchema=webapi_security"
      SECURITY_AUTH_DB_DATASOURCE_USERNAME: postgres
      SECURITY_AUTH_DB_DATASOURCE_PASSWORD: ${PG_SUPER_PASSWORD}
      SECURITY_AUTH_DB_DATASOURCE_SCHEMA: webapi_security
      # OpenID Connect configuration (Logto)
      # Property prefix updated for WebAPI p-hoffmann/openid branch: security.auth.openId.* (was security.oid.*)
      SECURITY_AUTH_OIDC_CLIENTID: ${LOGTO__D2E_APP__CLIENT_ID:-${LOGTO__ALP_APP__CLIENT_ID}}
      SECURITY_AUTH_OIDC_APISECRET: ${LOGTO__D2E_APP__CLIENT_SECRET:-${LOGTO__ALP_APP__CLIENT_SECRET}}
      # Discover OIDC metadata directly from Logto over HTTPS:3001 — same host/port as
      # LOGTO__TOKEN_URL, so trex (token exchange) and WebAPI (discovery/JWKS) reach Logto
      # consistently. The discovered issuer is still http://alp-caddy:8080/oidc (matches the
      # token iss / LOGTO__ISSUER); only the fetch endpoint + jwks_uri are proper HTTPS on :3001.
      SECURITY_AUTH_OIDC_URL: "https://${PROJECT_NAME:-d2e}-logto-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:3001/oidc/.well-known/openid-configuration"
      # External URL for browser redirects - used to rewrite internal OIDC URLs to external ones
      SECURITY_AUTH_OIDC_EXTERNALURL: "https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}:${CADDY_PORT:-${PORT:-443}}/oidc"
      SECURITY_AUTH_OIDC_LOGOUTURL: "https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}:${CADDY_PORT:-${PORT:-443}}/oidc/session/end"
      # Role claim in the ID token (Logto emits `roles` when the roles feature is enabled for the app)
      SECURITY_AUTH_OIDC_ROLESCLAIM: "roles"
      # NOTE: scopes `openid profile email` are added by default by the new WebAPI; extraScopes no longer required
      # OAuth callback URLs - must use external URL for browser redirects
      # NOTE: callback path now includes /openid segment (Spring oauth2Login convention).
      # The Logto app's redirect URI must be updated to end with /user/oauth/callback/openid
      SECURITY_AUTH_OAUTH_CALLBACK_API: "https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}:${CADDY_PORT:-${PORT:-443}}/WebAPI/user/oauth/callback"
      SECURITY_AUTH_OAUTH_CALLBACK_UI: "https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}:${CADDY_PORT:-${PORT:-443}}/atlas/#/welcome"
      # TrexSQL configuration
      # PG__ vars needed by trex (npm start) for database connection
      PG__DB_NAME: alp
      PG__HOST: ${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}
      PG__PORT: ${PG_PORT:-5432}
      # Schemas PostGraphile introspects for /trex/graphql - `notebook` exposes
      # the studies/notebooks tables provisioned by the notebook-schema
      # migrations plugin mounted above.
      PG_SCHEMA: ${PG_SCHEMA:-trexdb,notebook}
      # ── DB bootstrap (replaces the alp-minerva-pg-mgmt-init container) ──────
      # trex's d2e-compat runD2eBootstrap() reads these before plugin init and
      # provisions the login users, the anon/authenticated/service_role roles,
      # the schemas and their grants. Same contract the retired container used,
      # so the SQL is unchanged and re-runs idempotently on every boot.
      POSTGRES_MANAGE_CONFIG: |-
        {
         "databases": {
          "+${PG_DB_NAME:-alp}": {
           "schemas": {
            "+cdw_config": {},
            "+jobplugins": {},
            "+logto": {},
            "+portal": {},
            "+public": {},
            "+qe_config": {},
            "+terminology": {},
            "+usermgmt": {},
            "+files_manager": {},
            "+perseus": {},
            "+white_rabbit": {},
            "+trex": {},
            "+storage": {},
            "+strategus": {},
            "+notebook": {},
            "+network": {}
           }
          }
         }
        }
      POSTGRES_MANAGE_USERS: |-
        {
         "${PG_DB_NAME:-alp}": {
          "manager": "${PG_ADMIN_USER:-alp_pg_admin_user}",
          "managerPassword": "${PG_ADMIN_PASSWORD}",
          "reader": "${PG_WRITE_USER:-alp_pg_write_user}",
          "readerPassword": "${PG_WRITE_PASSWORD}",
          "writer": "${PG_WRITE_USER:-alp_pg_write_user}",
          "writerPassword": "${PG_WRITE_PASSWORD}",
          "logtoManager": "${PG_LOGTO_MANAGER:-${PG__LOGTO_MANAGER_USER:-logto_postgres}}",
          "logtoManagerPassword": "${PG__LOGTO_MANAGER_PASSWORD}"
         }
        }
      POSTGRES_MANAGE_ROLES_USERS: ${POSTGRES_MANAGE_ROLES_USERS:-{}}
      TREX_SQL_PASSWORD: ${TREX__SQL__PASSWORD:?TREX__SQL__PASSWORD must be set (run d2e init); refusing default pencil}
      TREX__SQL__PORT: ${TREX__SQL__PORT:-5433}
      TREX__SQL__DBNAME: postgres
      TREX__ENDPOINT_URL: "http://localhost:33001"
      TREX_ROUTES: '{"d2e":"http://localhost:33001"}'
      TREX_EXTENSIONS_PATH: /usr/src/node_modules/@trex
      TREX_POOL_SIZE: ${TREX_POOL_SIZE:-1024}
      TREXSQL_ENABLED: "true"
      # hades-api Run backend: R env cache + per-run output, both under the
      # hades-data volume; work schema for staged cohort/analysis data.
      HADES_ENVS_BASE_DIR: /data/hades/envs
      HADES_OUTPUT_BASE_DIR: /data/hades/runs
      HADES_WORK_SCHEMA: _config.work
      SWARM_NODE: d2e
      SWARM_CONFIG: |-
        {
          "cluster_id": "d2e",
          "nodes": {
            "d2e": {
              "gossip_addr": "0.0.0.0:4200",
              "extensions": [
                {
                  "name": "trexas",
                  "config": {
                    "host": "0.0.0.0",
                    "port": 33001,
                    "main_service_path": "/usr/src/core/server/index.eszip",
                    "event_worker_path": "/usr/src/core/event/index.eszip",
                    "tls_port": 33000,
                    "tls_cert_path": "/usr/src/cert/cert.pem",
                    "tls_key_path": "/usr/src/cert/key.pem"
                  }
                },
                {
                  "name": "pgwire",
                  "config": { "host": "0.0.0.0", "port": 5433, "password": "${TREX__SQL__PASSWORD:?TREX__SQL__PASSWORD must be set (run d2e init); refusing default pencil}" }
                }
              ]
            }
          }
        }
      REP_PG: postgres://postgres:${DEMO__DB_PASSWORD:-mypass}@demodb:5432/postgres
      TPM_USE_NODE_MODULES: "false"
      SERVICE_ROUTES: |-
        {
        "analytics": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001",
        "bookmark": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/analytics-svc/api/services/bookmark",
        "cdw": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001",
        "d2e-webapi": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/d2e-webapi",
        "webapi": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/WebAPI",
        "paConfig": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/pa-config-svc",
        "trex": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001",
        "queryGen": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001",
        "jobplugins": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001",
        "portalServer": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/system-portal",
        "dataset": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/gateway/api/dataset",
        "usermgmt": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/usermgmt/api",
        "strategus-analysis": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001",
        "terminology": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/terminology",
        "prefect": "https://${PROJECT_NAME:-d2e}-dataflow-gen-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:41120/d2e/api",
        "idIssuerUrl": "https://${PROJECT_NAME:-d2e}-logto-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:3001/oidc",
        "minio": "",
        "filesManager": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/files-manager/api",
        "whiteRabbit": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/white-rabbit/api",
        "alpdb": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/gateway/api/db",
        "logto": "https://${PROJECT_NAME:-d2e}-logto-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:3001",
        "supabaseStorage": "https://${PROJECT_NAME:-d2e}-supabase-storage-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:9000",
        "dataflowStorage": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/system-portal/supabase-storage",
        "mcp-server": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/mcp/chat",
        "materializeCohorts": "https://${PROJECT_NAME:-d2e}-materialize-cohorts:3333",
        "fhirServer": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:8094",
        "fhirGateway": "http://${PROJECT_NAME:-d2e}-trex.${TLS__INTERNAL__DOMAIN:-d2e.local}:33001/fhir-gateway"
        }
      PG_SUPER_PASSWORD: ${PG_SUPER_PASSWORD}
      PG_SUPER_USER: ${PG_SUPER_USER:-postgres}
      PG_MANAGE_PASSWORD: ${PG_ADMIN_PASSWORD}
      PG_MANAGE_USER: ${PG_ADMIN_USER:-alp_pg_admin_user}
      PG_PASSWORD: ${PG_WRITE_PASSWORD}
      PG_USER: ${PG_WRITE_USER:-alp_pg_write_user}
      PORTAL__LOG_DISCLAIMER: ${PORTAL__LOG_DISCLAIMER:-false}
      PREFECT_API_URL: ${PREFECT_API_URL:-https://${PROJECT_NAME:-d2e}-dataflow-gen-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:41120/d2e/api}
      # Gates the alp-dataflow-gen-init function (waitforEnvVar: PREFECT_HEALTH_CHECK)
      # so trex waits for the Prefect API to be reachable before seeding its
      # variables/blocks/workpool. Without it the init runs at boot before Prefect
      # is up, crashes with ECONNREFUSED, and DQD flow runs later fail with 500.
      PREFECT_HEALTH_CHECK: ${PREFECT_HEALTH_CHECK:-https://${PROJECT_NAME:-d2e}-dataflow-gen-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:41120/d2e/api/health}
      # The trex core auto-deploys flow plugins to Prefect (core/server/plugin/flow.ts):
      # it waits for a worker pool named PREFECT_POOL before registering deployments
      # and sets work_pool_name to it. Must match the pool created by the
      # dataflow-gen-worker. Default is the pixi process pool; rollback to the
      # docker worker = PREFECT_POOL=docker-pool + WORKPOOL_TYPE=docker (see the
      # alp-dataflow-gen-worker service comment).
      PREFECT_POOL: ${PREFECT_POOL:-process-pool}
      WORKPOOL_TYPE: ${WORKPOOL_TYPE:-process}
