  alp-caddy:
    container_name: &c1 ${PROJECT_NAME:-d2e}-caddy
    hostname: ${PROJECT_NAME:-d2e}-caddy.${TLS__INTERNAL__DOMAIN:-d2e.local}
    platform: linux/amd64
    image: caddy:2.8-alpine
    logging:
      options:
        tag: *c1
    networks:
      alp:
        priority: 20
    command: >
      sh -c "
        mkdir -p /srv/caddy-config &&
        printf '%s' \"$$TLS__INTERNAL__CA_CRT\" > /srv/caddy-config/ca.pem &&
        cat <<EOT > /srv/caddy-config/Caddyfile
        {
          debug
          servers {
            protocols h1
          }
          pki {
            ca local {
              name \"D2E Local CA\"
              root_cn \"D2E Local CA - 2024 ECC Root\"
              intermediate_cn \"D2E Local CA - ECC Intermediate\"
            }
          }
        }

        (publicurlredirect) {
          ${CADDY__D2E__ALIAS_PUBLIC_FQDN:-${CADDY__ALP__ALIAS_PUBLIC_FQDN:-}} {
            $TLS__CADDY_DIRECTIVE
            redir https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}{uri} permanent
          }
        }

        (proxy_headers_codespaces) {
          header_up Host {upstream_hostport}
          header_up X-Forwarded-Host ${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}
          header_up X-Forwarded-Proto {scheme}
          header_up X-Forwarded-For {remote}
        }

        (proxy_headers_default) {
          header_up Host ${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}:${CADDY_PORT:-${PORT:-443}}
          header_up X-Forwarded-Host ${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}:${CADDY_PORT:-${PORT:-443}}
          header_up X-Forwarded-Port ${CADDY_PORT:-${PORT:-443}}
          header_up X-Forwarded-Proto https
          header_up X-Forwarded-For {remote}
        }

        (portal) {
          log {
            format console {
              level_format color
            }
          }

          # Logto api server
          @logto {
            path /api/*
            path /oidc/*
            path /sign-in
            path /consent
            path /callback/* # For azure connector

            path /d2e/logto/index.*
            path /d2e/logto/assets/* # logto assets are moved to this path
          }

          handle @logto {
            uri strip_prefix /d2e/logto
            reverse_proxy https://${PROJECT_NAME:-d2e}-logto-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:3001 {
              import ${PROXY_HEADERS_MODE:-proxy_headers_default}
              # Host + X-Forwarded-* make Logto (TRUST_PROXY_HEADER=true) emit external URLs
              # for browser-facing endpoints (authorize/sign-in). The issuer claim itself is
              # sourced from Logto's ENDPOINT env var (internal http://alp-caddy:8080), which
              # lets WebAPI's Spring OAuth2 client validate iss without TLS/DNS gymnastics.
              header_up Host ${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}${PORT:+:${PORT:-443}}
              transport http {
                tls
                tls_trust_pool file /srv/caddy-config/ca.pem
                read_buffer 8192
              }
            }
          }

          # Redirect uppercase /Atlas to lowercase /atlas
          @atlas_uppercase {
            path_regexp atlas_case ^/Atlas(.*)$$
          }
          redir @atlas_uppercase /atlas{re.atlas_case.1} 301

          @studio path /plugins/trex/studio /plugins/trex/studio/*
          handle @studio {
            reverse_proxy http://${PROJECT_NAME:-d2e}-trex:33001 {
              import ${PROXY_HEADERS_MODE:-proxy_headers_default}
              transport http {
                read_buffer 8192
              }
              header_down -X-Frame-Options
              header_down -Content-Security-Policy
            }
          }

          # Default handler - all other routes go to trex gateway
          handle {
            reverse_proxy http://${PROJECT_NAME:-d2e}-trex:33001 {
              import ${PROXY_HEADERS_MODE:-proxy_headers_default}
              transport http {
                read_buffer 8192
              }
            }
          }
        }

        $INSTANCE_SPECIFIC_CONFIG

        # Enable if need to access admin console
        # http://localhost:3002 {
        #   uri strip_prefix /d2e/logto
        #   reverse_proxy http://${PROJECT_NAME:-d2e}-logto-1:3002 {
        #     header_up Host {host}
        #     header_up X-Forwarded-Proto http
        #     header_up X-Forwarded-Port 3002
        #     transport http {
        #       read_buffer 8192
        #     }
        #   }
        # }

        # Internal HTTP listener for service-to-service communication (avoids TLS issues)
        # Does NOT set X-Forwarded headers - metadata will have internal URLs for token exchange
        :8080 {
          @oidc {
            path /oidc/*
          }
          handle @oidc {
            reverse_proxy https://${PROJECT_NAME:-d2e}-logto-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:3001 {
              transport http {
                tls
                tls_trust_pool file /srv/caddy-config/ca.pem
              }
            }
          }

          # Enable if need to access admin console
          # @admin_api path /api/*
          # handle @admin_api {
          #   reverse_proxy http://${PROJECT_NAME:-d2e}-logto-1:3002
          # }
          
          # @admin_auth path /sign-in* /sign-up* /consent* /forgot-password* /callback/* /social/*
          # handle @admin_auth {
          #   reverse_proxy http://${PROJECT_NAME:-d2e}-logto-1:3001
          # }

          respond 404
        }

        https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}${CADDY__ADDITIONAL_HOSTS:+, ${CADDY__ADDITIONAL_HOSTS}} {
          $TLS__CADDY_DIRECTIVE

          @aliasbasepaths {
              path_regexp portal_basepath ^/(d2e|portal)(/)?$
          }
          redir @aliasbasepaths /d2e/portal
          import portal
        }

        # Plain-HTTP listener (no TLS) so service workers register without a
        # trusted cert. Reuses the same handles via the (portal) snippet.
        # localhost over http is a secure context, so the results-viewer
        # shinylive service worker registers without the self-signed-cert error.
        # Access the app at http://localhost:41180.
        http://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}:41180 {
          @aliasbasepaths2 {
              path_regexp portal_basepath ^/(d2e|portal)(/)?$
          }
          redir @aliasbasepaths2 /d2e/portal
          import portal
        }
      EOT
        caddy run --environ --config /srv/caddy-config/Caddyfile --adapter caddyfile
      "
    ports:
      - ${CADDY_PORT:-${PORT:-443}}:443
      - 41180:41180  # plain-http route (no TLS) so service workers work locally
      # - 3002:3002 # Enable if need to access admin console
      # - 8080:8080 # Enable if need to access admin console
    restart: ${DOCKER__RESTART_POLICY:-unless-stopped}
    volumes:
      - caddy:/data
    environment:
      CADDY__D2E__PUBLIC_FQDN: ${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}
      TLS__CADDY_DIRECTIVE: ${TLS__CADDY_DIRECTIVE:-tls internal}
      INSTANCE_SPECIFIC_CONFIG: ${INSTANCE_SPECIFIC_CONFIG:-}
      CADDY__D2E__ALIAS_PUBLIC_FQDN: ${CADDY__D2E__ALIAS_PUBLIC_FQDN:-${CADDY__ALP__ALIAS_PUBLIC_FQDN:-}}
      PROJECT_NAME: ${PROJECT_NAME:-d2e}
      # Read by the entrypoint above to write /srv/caddy-config/ca.pem, which the
      # tls_trust_pool directives use. Only the CA is passed — not the *x-tls
      # anchor — so the internal private key stays out of this container.
      TLS__INTERNAL__CA_CRT: ${TLS__INTERNAL__CA_CRT}

  alp-dataflow-gen:
    container_name: &c2 ${PROJECT_NAME:-d2e}-dataflow-gen-1
    depends_on:
      alp-logto-post-init:
        condition: service_completed_successfully
      # Needs the alp_pg_* users, which trex's bootstrap creates.
      trex:
        condition: service_healthy
    healthcheck:
      interval: 30s
      retries: 30
      start_period: 30s
      test:
        [
          "CMD-SHELL",
          "curl -fk https://localhost:41120/d2e/api/health || exit 1",
        ]
      timeout: 30s
    hostname: &dataflow-gen-hostname ${PROJECT_NAME:-d2e}-dataflow-gen-1.${TLS__INTERNAL__DOMAIN:-d2e.local}
    image: ${DOCKER_IMAGE_PREFIX:-ghcr.io/ohdsi/}d2e-dataflow-gen:${DOCKER_TAG_NAME:-develop}
    platform: linux/amd64
    logging:
      options:
        tag: *c2
    networks:
      alp:
        priority: 20
      data:
        priority: 10
    restart: ${DOCKER__RESTART_POLICY:-unless-stopped}
    environment:
      <<:
        - *x-converter
        - *x-pg
        - *x-tls
      LOCAL_DEBUG: "false"
      DATAFLOW_GEN_HOSTNAME: *dataflow-gen-hostname
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PG_SUPER_USER:-postgres}:${PG_SUPER_PASSWORD}@${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}:${PG_PORT:-5432}/${PG_DB_NAME:-alp}
      PREFECT_API_DEFAULT_LIMIT: 5000
      PREFECT_SERVER_API_BASE_PATH: /d2e/api
      PREFECT_UI_SERVE_BASE: /d2e
      # Relative API URL: the UI calls whatever origin it was loaded from
      # (localhost, 127.0.0.1, or the Caddy public FQDN), so API calls stay
      # same-origin and avoid the cross-origin CORS preflight that the
      # in-container nginx answers with 503. Must line up with
      # PREFECT_SERVER_API_BASE_PATH (/d2e/api) above.
      PREFECT_UI_API_URL: /d2e/api
      PREFECT_UI_URL: https://127.0.0.1:41120/d2e
      PREFECT_LOGGING_LEVEL: DEBUG
      PREFECT_LOGGING_SERVER_LEVEL: WARNING
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      # Prefect itself stays on loopback, HTTP only; nginx (started by the
      # image's entrypoint.sh) is the only thing listening on 41120/the
      # docker network, terminating TLS with the shared TLS__INTERNAL__* cert.
      PREFECT_SERVER_API_HOST: 127.0.0.1
      PREFECT_UI_STATIC_DIRECTORY: /app/ui-files
      PREFECT_SERVER_API_PORT: 41121
      PREFECT_API_ENABLE_HTTP2: False

  # Pixi process worker: flow runs execute as subprocesses in per-plugin pixi
  # environments (run-flow.sh); plugin code+envs arrive as deployment-attached
  # artifacts from trex storage or the image's baked cache. Rollback to the
  # docker worker: PREFECT_POOL=docker-pool WORKPOOL_TYPE=docker (+ revert the
  # package.json command commit and use Dockerfile.docker-pool image).
  alp-dataflow-gen-worker:
    command:
      - pixi
      - run
      - --manifest-path
      - /opt/worker/pyproject.toml
      - sh
      - -c
      - >-
        rm -rf /root/.prefect/storage/run_cache.db /root/.prefect/storage/events.db;
        printf '%s\n' "$$TLS__INTERNAL__CA_CRT" > /usr/local/share/ca-certificates/d2e-internal-ca.crt;
        update-ca-certificates;
        printf '\n%s\n' "$$TLS__INTERNAL__CA_CRT" >> "$$(python -c 'import certifi; print(certifi.where())')";
        prefect work-pool create '${PREFECT_POOL:-process-pool}' --type ${WORKPOOL_TYPE:-process};
        prefect worker start --pool '${PREFECT_POOL:-process-pool}' --type ${WORKPOOL_TYPE:-process}
        --name prefect-${WORKPOOL_TYPE:-process}-worker --with-healthcheck
        --limit ${D2E_WORKER_FLOW_RUN_LIMIT:-3}

    container_name: &c83 ${PROJECT_NAME:-d2e}-dataflow-gen-worker
    platform: linux/amd64
    depends_on:
      alp-logto-post-init:
        condition: service_completed_successfully
      alp-dataflow-gen:
        condition: service_healthy
    healthcheck:
      interval: 30s
      retries: 30
      start_period: 30s
      test:
        [
          "CMD",
          "pixi",
          "run",
          "--manifest-path",
          "/opt/worker/pyproject.toml",
          "python",
          "-c",
          "import urllib.request, sys; sys.exit(0 if 200 <= urllib.request.urlopen('http://localhost:8080/health', timeout=5).getcode() < 300 else 1)",
        ]
      timeout: 30s
    hostname: ${PROJECT_NAME:-d2e}-dataflow-gen-worker.${TLS__INTERNAL__DOMAIN:-d2e.local}
    image: ${DOCKER_IMAGE_PREFIX:-ghcr.io/ohdsi/}d2e-dataflow-gen-worker:${DOCKER_TAG_NAME:-develop}
    logging:
      options:
        tag: *c83
    mem_limit: ${D2E_MEMORY_LIMIT:-16G}
    networks:
      data:
        priority: 20
    volumes:
      # duckdb/cachedb data shared with trexsql; plugins travel as artifacts,
      # not volumes. The docker.sock mount is gone with the docker worker.
      - trex:/app/duckdb_data
    environment:
      <<:
        - *x-tls
      PREFECT_API_URL: https://${PROJECT_NAME:-d2e}-dataflow-gen-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:41120/d2e/api
      PREFECT_API_ENABLE_HTTP2: False
      # Trust the internal self-signed CA across all Python HTTP stacks. The
      # command writes the CA into the OS store (update-ca-certificates) and the
      # certifi bundle; these point urllib/requests at the OS bundle (which then
      # includes the CA). provision-envs (entrypoint, urllib) picks it up on its
      # next 30s poll once the command has run.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      INSTALL_SQLALCHEMY_HANA: ${INSTALL_SQLALCHEMY_HANA:-true}
      # trex-embedded supabase storage (artifact source); service key = JWT
      # with role service_role signed with trex's PGRST_JWT_SECRET
      TREX_STORAGE_URL: ${TREX_STORAGE_URL:-http://${PROJECT_NAME:-d2e}-trex:33001/plugins/trex/storage-api}
      TREX_STORAGE_SERVICE_KEY: ${TREX_STORAGE_SERVICE_KEY:-}
      D2E_MEMORY_LIMIT: ${D2E_MEMORY_LIMIT:-16G}
      D2E_SWAP_LIMIT: ${D2E_SWAP_LIMIT:-64G}
      PREFECT_WORKER_WEBSERVER_HOST: 0.0.0.0
      PREFECT_TASKS_CACHE_ENABLED: false
      PREFECT_FLOW_RUN_CACHE_ENABLED: false
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: false
      PREFECT_EVENTS_ENABLED: false
      # cohort_discovery: Hutch Relay Task API connection, shared across every
      # dataset's poller runs
      TASK_API_BASE_URL: ${TASK_API_BASE_URL:-}
      TASK_API_USERNAME: ${TASK_API_USERNAME:-}
      TASK_API_PASSWORD: ${TASK_API_PASSWORD:-}
      TASK_API_TYPE: ${TASK_API_TYPE:-a}
      TASK_API_ENFORCE_HTTPS: ${TASK_API_ENFORCE_HTTPS:-true}
      LOW_NUMBER_SUPPRESSION_THRESHOLD: ${LOW_NUMBER_SUPPRESSION_THRESHOLD:-10}
      ROUNDING_TARGET: ${ROUNDING_TARGET:-10}
      D2E_BIGQUERY_JDBC_URL: ${D2E_BIGQUERY_JDBC_URL:-}

  # Needed only for future alterations of schema when version upgrades
  # alp-logto-db-post-alterations-init:
  #   depends_on:
  #       alp-minerva-postgres:
  #         condition: service_healthy
  #   image: ghcr.io/logto-io/logto:1.12
  #   entrypoint: ["sh", "-c", "npm run alteration deploy latest"]
  #   environment:
  #     CI: true
  #     DB_URL: postgres://${PG_SUPER_USER:-postgres}:${PG_SUPER_PASSWORD}@alp-minerva-postgres-1:${PG_PORT:-5432}/${PG_DB_NAME:-postgres}
  #   networks:
  #     - alp

  alp-logto-post-init:
    container_name: ${PROJECT_NAME:-d2e}-logto-post-init-1
    depends_on:
      alp-logto:
        condition: service_healthy
    image: ${DOCKER_IMAGE_PREFIX:-ghcr.io/ohdsi/}d2e-logto-post-init:${DOCKER_TAG_NAME:-develop}
    networks:
      alp:
        priority: 20
    platform: linux/amd64
    # The image's ENTRYPOINT is ["npm","run","seed"] with no shell, so the CA has
    # to be written here. NODE_EXTRA_CA_CERTS is the only route that works in this
    # image: it has no update-ca-certificates, and Node does not read the OS trust
    # store anyway. Verified that Node 18's global fetch (undici) honours it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/cert
        printf '%s' "$$TLS__INTERNAL__CA_CRT" > /tmp/cert/ca.pem
        if [ ! -s /tmp/cert/ca.pem ]; then
          echo "FATAL: TLS__INTERNAL__CA_CRT is empty; refusing to seed without CA trust" >&2
          exit 1
        fi
        export NODE_EXTRA_CA_CERTS=/tmp/cert/ca.pem
        exec npm run seed
    environment:
      ENV_TYPE: ${ENV_TYPE:-local}
      # This container POSTs the M2M client secret, the basic-auth credentials and
      # every LOGTO__CLIENT_APPS secret to logto's admin API over the internal TLS
      # endpoint, so it verifies that endpoint against the internal CA. Only the CA
      # is passed, not the *x-tls anchor, which would also hand it the internal
      # private key it has no use for.
      TLS__INTERNAL__CA_CRT: ${TLS__INTERNAL__CA_CRT}
      # Used by src/middleware/logto.ts to derive the admin-server URL when
      # LOGTO__ADMIN_SERVER__FQDN_URL is unset; without it the fallback assumes a
      # container name the deployment may not use.
      PROJECT_NAME: ${PROJECT_NAME:-d2e}
      PG__DB_NAME: alp
      PG__HOST: ${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}
      PG__PASSWORD: ${PG__LOGTO_MANAGER_PASSWORD}
      PG__PORT: ${PG_PORT:-5432}
      PG__USER: ${PG__LOGTO_MANAGER_USER:-logto_postgres}
      PG__SSL: ${PG__SSL:-false}
      PG__SCHEMA: logto
      LOGTO__CONNECTOR_CONFIG: ${LOGTO__CONNECTOR_CONFIG:-}
      LOGTO__ENABLE_REGISTRATION: ${LOGTO__ENABLE_REGISTRATION:-false}
      LOGTO__DISABLE_BASIC_AUTH: ${LOGTO__DISABLE_BASIC_AUTH:-false}
      LOGTO__SOCIAL_SIGNIN_TARGETS: ${LOGTO__SOCIAL_SIGNIN_TARGETS:-}
      # LOGTO__CONNECTOR_CONFIG: '{ "id": "y9nq6f91yeg19kwt1x6xz","connectorId": "azuread-alp", "config": { "clientId": "${ENTRA__CLIENT_ID}", "tenantId": "${ENTRA__TENANT_ID}", "clientSecret": "${ENTRA__CLIENT_SECRET}", "cloudInstance": "https://login.microsoftonline.com", "scopes": "openid,profile,email,offline_access"}, "syncProfile": true}'
      # LOGTO__CONNECTOR_CONFIG: '{ "id": "9mf50ajua2ye7pydd2nxk", "connectorId": "entra-external-id-alp", "config": { "clientId": "${ENTRA_EXTID__CLIENT_ID}", "clientSecret": "${ENTRA_EXTID__CLIENT_SECRET}", "tenantSubdomain": "${ENTRA_EXTID__TENANT_SUBDOMAIN}", "tenantId": "${ENTRA_EXTID__TENANT_ID}", "scopes": "openid,profile,email,offline_access"}, "syncProfile": true}'
      # LOGTO__CUSTOM_JWT: '{"environmentVariables": {"clientId": "${ENTRA__CLIENT_ID}", "tenantId": "${ENTRA__TENANT_ID}", "clientSecret": "${ENTRA__CLIENT_SECRET}"}, "script": "/**\n* This function is called during the access token generation process to get custom claims for the JWT token.\n* Limit custom claims to under 50KB.\n*\n* @param {Object} payload - The input payload of the function.\n* @param {AccessTokenPayload} payload.token -The JWT token.\n* @param {Context} payload.context - Logto internal data that can be used to pass additional information\n* @param {EnvironmentVariables} [payload.environmentVariables] - The environment variables.\n*\n* @returns The custom claims.\n*/\n\n// @ts-ignore\nconst getCustomJwtClaims = async ({ token, context, environmentVariables, extra }) => {\n  const clientId = environmentVariables?.clientId || \"\";\n  const clientSecret = environmentVariables?.clientSecret || \"\";\n  const tenantId = environmentVariables?.tenantId || \"\";\n  const refreshToken = extra.thirdPartyRefreshToken || \"\";\n\n  const tokenEndpoint = `https://login.microsoftonline.com/$${tenantId}/oauth2/v2.0/token`;\n\n  const params =\n    `client_id=$${encodeURIComponent(clientId)}` +\n    `&client_secret=$${encodeURIComponent(clientSecret)}` +\n    `&refresh_token=$${encodeURIComponent(refreshToken)}` +\n    `&grant_type=refresh_token` +\n    `&scope=openid`;\n\n  let thirdPartyToken = extra.thirdPartyToken;\n  let thirdPartyRefreshToken = refreshToken;\n  try {\n    const response = await fetch(tokenEndpoint, {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/x-www-form-urlencoded\" },\n      body: params,\n    });\n\n    if (!response.ok) {\n      const responseBody = await response.text();\n      throw new Error(`Error refreshing token: $${response.statusText}: $${responseBody}: $${params}`);\n    }\n\n    const data = await response.json();\n    thirdPartyToken = data.id_token;\n    thirdPartyRefreshToken = data.refresh_token;\n  } catch (error) {}\n\n  const email = context.user?.primaryEmail || \"\";\n\n  const scopes = [];\n\n  for (const role of context.user.roles || []) {\n    for (const scope of role.scopes || []) {\n      scopes.push(scope.name);\n    }\n  }\n\n  return { thirdPartyToken, thirdPartyRefreshToken, email, roles: scopes };\n};\n", "tokenSample": {"aud": "http://localhost:3000/api/test", "gty": "authorization_code", "jti": "f1d3d2d1-1f2d-3d4e-5d6f-7d8a9d0e1d2", "kind": "AccessToken", "scope": "read write", "grantId": "grant_123", "clientId": "my_app", "accountId": "uid_123"}, "contextSample": {"user": {"id": "123", "name": "Foo Bar", "roles": [], "avatar": "https://example.com/avatar.png", "profile": {}, "username": "foo", "customData": {}, "identities": {}, "hasPassword": false, "primaryEmail": "foo@logto.io", "primaryPhone": "+1234567890", "applicationId": "my-app", "organizations": [], "ssoIdentities": [], "organizationRoles": [], "mfaVerificationFactors": []}}}'
      LOGTO__CUSTOM_JWT: '{"script": "/**\n* This function is called during the access token generation process to get custom claims for the JWT token.\n* Limit custom claims to under 50KB.\n*\n* @param {Object} payload - The input payload of the function.\n* @param {AccessTokenPayload} payload.token -The JWT token.\n* @param {Context} payload.context - Logto internal data that can be used to pass additional information\n* @param {EnvironmentVariables} [payload.environmentVariables] - The environment variables.\n*\n* @returns The custom claims.\n*/\n\n// @ts-ignore\nconst getCustomJwtClaims = async ({ token, context, environmentVariables, extra }) => {\n  let rewrites = [];\n  try {\n    const raw = environmentVariables && environmentVariables.scopeRewrites;\n    if (raw) {\n      const parsed = JSON.parse(raw);\n      if (Array.isArray(parsed)) rewrites = parsed;\n    }\n  } catch (e) {}\n\n  const applyRewrites = (name) => {\n    for (let i = 0; i < rewrites.length; i++) {\n      const rule = rewrites[i];\n      if (!rule || !rule.pattern) continue;\n      const re = new RegExp(rule.pattern);\n      if (re.test(name)) return name.replace(re, rule.replacement || \"\");\n    }\n    return name;\n  };\n\n  const scopes = [];\n\n  for (const role of context.user.roles || []) {\n    for (const scope of role.scopes || []) {\n      scopes.push(applyRewrites(scope.name));\n    }\n  }\n\n  // Expose the human username on the access token so downstream consumers\n  // (OHDSI WebAPI / Atlas3) display the real login instead of the opaque `sub`.\n  const username = context.user?.username || \"\";\n  const name = context.user?.name || \"\";\n  const email = context.user?.primaryEmail || \"\";\n\n  return { roles: scopes, physionet_access_token: extra?.thirdPartyToken || null, physionet_refresh_token: extra?.thirdPartyRefreshToken || null, username, name: name || username, preferred_username: username || name, email };\n};\n", "tokenSample": {"aud": "http://localhost:3000/api/test", "gty": "authorization_code", "jti": "f1d3d2d1-1f2d-3d4e-5d6f-7d8a9d0e1d2", "kind": "AccessToken", "scope": "read write", "grantId": "grant_123", "clientId": "my_app", "accountId": "uid_123"}, "contextSample": {"user": {"id": "123", "name": "Foo Bar", "roles": [], "avatar": "https://example.com/avatar.png", "profile": {}, "username": "foo", "customData": {}, "identities": {}, "hasPassword": false, "primaryEmail": "foo@logto.io", "primaryPhone": "+1234567890", "applicationId": "my-app", "organizations": [], "ssoIdentities": [], "organizationRoles": [], "mfaVerificationFactors": []}}, "environmentVariables": {}}'
      # Rewrite Logto scope names to canonical WebAPI sec_role names
      LOGTO__JWT_SCOPE_REWRITES: '[{"pattern":"^cohort-reader$","replacement":"cohort reader"},{"pattern":"^cohort-creator$","replacement":"cohort creator"},{"pattern":"^concept-set-creator$","replacement":"concept set creator"},{"pattern":"^source-user-(.+)$","replacement":"Source user ($$1)"}]'
      LOGTO__CLIENT_APPS: '[{"name":"alp-svc","description":"alp-svc","type":"MachineToMachine", "id": "${LOGTO__D2E_SVC__CLIENT_ID:-${LOGTO__ALP_SVC__CLIENT_ID}}", "secret": "${LOGTO__D2E_SVC__CLIENT_SECRET:-${LOGTO__ALP_SVC__CLIENT_SECRET}}"},{"name":"alp-data","description":"alp-data","type":"MachineToMachine", "id": "${LOGTO__D2E_DATA__CLIENT_ID:-${LOGTO__ALP_DATA__CLIENT_ID}}", "secret": "${LOGTO__D2E_DATA__CLIENT_SECRET:-${LOGTO__ALP_DATA__CLIENT_SECRET}}"},{"name":"alp-app","description":"alp-app","type":"Traditional", "id": "${LOGTO__D2E_APP__CLIENT_ID:-${LOGTO__ALP_APP__CLIENT_ID}}", "secret": "${LOGTO__D2E_APP__CLIENT_SECRET:-${LOGTO__ALP_APP__CLIENT_SECRET}}", "oidcClientMetadata":{"redirectUris":["https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}${PORT:+:${PORT:-443}}/d2e/portal/login-callback","https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}${PORT:+:${PORT:-443}}/d2e/ui/gateway/dashboard","https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}${PORT:+:${PORT:-443}}/WebAPI/user/oauth/callback/openid","https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}${PORT:+:${PORT:-443}}/atlas-login/","https://localhost:4000/d2e/portal/login-callback","https://localhost:8081","http://localhost:41180/d2e/portal/login-callback","http://localhost:41180/d2e/ui/gateway/dashboard","http://localhost:41180/WebAPI/user/oauth/callback/openid","http://localhost:41180/atlas-login/"],"postLogoutRedirectUris":["https://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}${PORT:+:${PORT:-443}}/d2e/portal","https://localhost:4000/d2e/portal","https://localhost:8081","http://localhost:41180/d2e/portal"]},"customClientMetadata":{"corsAllowedOrigins":[],"refreshTokenTtlInDays":14,"alwaysIssueRefreshToken":true,"rotateRefreshToken":true}}]'
      LOGTO__RESOURCE: '{"name":"alp-default","indicator":"https://alp-default","accessTokenTtl":3600}'
      LOGTO__USER: '{"username":"admin","initialPassword":"Updatepassword12345"}'
      # Logto roles are mapped to scopes by name via LOGTO__ROLES_SCOPES below
      # (see services/alp-logto/post-init/src/main.ts; falls back to index-wise
      # pairing with LOGTO__SCOPES only when LOGTO__ROLES_SCOPES is empty). When a
      # scope's name matches a WebAPI sec_role (case-insensitive), WebAPI's OIDC
      # handler auto-syncs that role for the user; unmatched scope names are ignored.
      # The role.systemadmin → ["role.systemadmin","admin"] entry in LOGTO__ROLES_SCOPES
      # carries the `admin` WebAPI role onto users with role.systemadmin.
      LOGTO__ROLES: '[{"name":"role.systemadmin","description":"System admin","type":"User"},{"name":"role.useradmin","description":"User admin","type":"User"},{"name":"role.dashboardviewer","description":"Dashboard viewer","type":"User"},{"name":"role.viewer","description":"Viewer","type":"User"},{"name":"role.jobrunner","description":"Job runner","type":"User"},{"name":"role.studyresultsreader","description":"Study results reader","type":"User"},{"name":"role.etlmappingcontributor","description":"ETL mapping contributor","type":"User"}]'
      LOGTO__SCOPES: '[{"name":"role.systemadmin","description":"System admin"},{"name":"role.useradmin","description":"User admin"},{"name":"role.dashboardviewer","description":"Dashboard viewer"},{"name":"role.viewer","description":"Viewer"},{"name":"role.jobrunner","description":"Job runner"},{"name":"role.studyresultsreader","description":"Study results reader"},{"name":"role.etlmappingcontributor","description":"ETL mapping contributor"},{"name":"admin","description":"WebAPI admin role"},{"name":"anonymous","description":"WebAPI anonymous role"},{"name":"cohort-reader","description":"WebAPI cohort reader role (rewritten to \"cohort reader\" by JWT customizer)"},{"name":"cohort-creator","description":"WebAPI cohort creator role (rewritten to \"cohort creator\" by JWT customizer)"},{"name":"concept-set-creator","description":"WebAPI concept set creator role (rewritten to \"concept set creator\" by JWT customizer)"}]'
      LOGTO__ROLES_SCOPES: '[{"roleName":"role.systemadmin","scopeNames":["role.systemadmin","admin"]},{"roleName":"role.useradmin","scopeNames":["role.useradmin"]},{"roleName":"role.dashboardviewer","scopeNames":["role.dashboardviewer"]},{"roleName":"role.viewer","scopeNames":["role.viewer","anonymous"]},{"roleName":"role.jobrunner","scopeNames":["role.jobrunner"]},{"roleName":"role.studyresultsreader","scopeNames":["role.studyresultsreader"]},{"roleName":"role.etlmappingcontributor","scopeNames":["role.etlmappingcontributor"]}]'
      LOGTO__ADMIN_SERVER__FQDN_URL: "https://${PROJECT_NAME:-d2e}-logto-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:3002"
      LOGTO__CLIENTID_PASSWORD__BASIC_AUTH: ${LOGTO__CLIENTID_PASSWORD__BASIC_AUTH}
      LOGTO__ALP_ADMIN_APP: '{"application": {"id": "${LOGTO_API_M2M_CLIENT_ID}", "name":"alp-admin","description":"alp-admin", "secret": "${LOGTO_API_M2M_CLIENT_SECRET}"}, "role": { "name":"api-access","description":"Logto API access"}}'
      LOGTO__TERM_OF_USE_URL: ${LOGTO__TERM_OF_USE_URL:-}
      LOGTO__PRIVACY_POLICY_URL: ${LOGTO__PRIVACY_POLICY_URL:-}
      LOGTO__CUSTOM_CSS: ${LOGTO__CUSTOM_CSS:-}
      CADDY__D2E__PUBLIC_FQDN: ${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}${PORT:+:${PORT:-443}}

  alp-logto:
    container_name: &c8 ${PROJECT_NAME:-d2e}-logto-1
    depends_on:
      # Only Postgres: the wait for trex's bootstrap is the beacon poll in the
      # entrypoint below, not a depends_on edge (that would be circular).
      alp-minerva-postgres:
        condition: service_healthy
    healthcheck:
      interval: 20s
      retries: 30
      start_period: 120s
      test:
        - CMD
        - wget
        - --proxy
        - off
        - --no-check-certificate
        - -O
        - logto.status
        - https://localhost:3001/api/status
    hostname: ${PROJECT_NAME:-d2e}-logto-1.${TLS__INTERNAL__DOMAIN:-d2e.local}
    platform: linux/amd64
    image: ${DOCKER_IMAGE_PREFIX:-ghcr.io/ohdsi/}d2e-logto:${DOCKER_TAG_NAME:-develop}
    logging:
      options:
        tag: *c8
    networks:
      alp:
        priority: 20
      data:
        priority: 10
    entrypoint:
      - sh
      - -c
      - |
        # TLS material first: it is instant, and the guard below then fails fast on a
        # misconfiguration instead of after the multi-minute database wait further down.
        # umask is scoped to the writes so the private key lands 0600 while cert.pem
        # and ca.pem stay readable to non-root consumers.
        (
          umask 077
          mkdir -p /tmp/cert
          printf '%s' "$$TLS__INTERNAL__CRT" > /tmp/cert/cert.pem
          printf '%s' "$$TLS__INTERNAL__KEY" > /tmp/cert/key.pem
          printf '%s' "$$TLS__INTERNAL__CA_CRT" > /tmp/cert/ca.pem
        )
        for pair in cert:TLS__INTERNAL__CRT key:TLS__INTERNAL__KEY ca:TLS__INTERNAL__CA_CRT; do
          if [ ! -s "/tmp/cert/$${pair%%:*}.pem" ]; then
            echo "FATAL: $${pair##*:} is empty; refusing to start" >&2
            exit 1
          fi
        done
        export HTTPS_CERT_PATH=/tmp/cert/cert.pem
        export HTTPS_KEY_PATH=/tmp/cert/key.pem
        export NODE_EXTRA_CA_CERTS=/tmp/cert/ca.pem
        # Wait for trex's DB bootstrap to create logto_postgres and the logto
        # schema before migrating. This is a poll rather than a depends_on
        # because trex -> alp-logto-post-init -> alp-logto already exists, so an
        # edge back to trex would be a circular dependency.
        # The gate has to be the privilege, not the schema. trex creates the schema
        # owned by postgres and grants logto_postgres CREATE on it as a separate
        # step, so a gate on existence alone lets logto start inside that window;
        # it then half-seeds and dies, and because the seed is not idempotent for
        # its logto_tenant_* roles, every later restart fails on "role already
        # exists" - a permanent crash loop from one early start.
        # The seed opens with `create schema if not exists logto`, and Postgres
        # checks CREATE on the database before it checks whether the schema
        # exists, so database CREATE is part of the gate too.
        # Connecting proves the login exists, the privilege checks prove the
        # grants landed. node is used deliberately: this image has neither curl nor
        # wget, but it does ship the pg client logto itself runs on.
        until node -e "
          const { Client } = require('pg');
          const c = new Client({ connectionString: process.env.DB_URL });
          c.connect()
            .then(() => c.query(\"select has_database_privilege(current_user, current_database(), 'CREATE') and case when to_regnamespace('logto') is null then false else has_schema_privilege(current_user, 'logto', 'CREATE') end as ok\"))
            .then(r => { c.end(); process.exit(r.rows[0].ok ? 0 : 1); })
            .catch(() => { try { c.end(); } catch (_) {} process.exit(1); });
        "; do
          echo "waiting for the trex database bootstrap ..."
          sleep 2
        done
        npm run cli db seed -- --swe && npm run cli db alteration deploy latest && node packages/core/d2e-grants.mjs && npm start
    restart: ${DOCKER__RESTART_POLICY:-unless-stopped}
    environment:
      <<:
        - *x-tls
      ADMIN_DISABLE_LOCALHOST: ${LOGTO__DISABLE_ADMIN_CONSOLE:-false}
      # ADMIN_ENDPOINT: http://${CADDY__D2E__PUBLIC_FQDN:-${CADDY__ALP__PUBLIC_FQDN:-localhost}}:3002 # Enable if need to access admin console
      DB_URL: postgres://${PG__LOGTO_MANAGER_USER:-logto_postgres}:${PG__LOGTO_MANAGER_PASSWORD}@${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}:${PG_PORT:-5432}/${PG_DB_NAME:-alp}?options=-c%20search_path%3Dlogto
      # ENDPOINT is the server-side base URL Logto stamps into token iss/discovery issuer (stable identity).
      # It must be reachable by backend services (e.g. WebAPI) that validate iss by fetching discovery.
      # Browser-visible URLs are derived per-request via TRUST_PROXY_HEADER=true + X-Forwarded-* from Caddy,
      # so users still see https://localhost:41100/... for sign-in/authorize.
      ENDPOINT: https://${PROJECT_NAME:-d2e}-logto-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:3001
      # Base URL the bundled connectors (alp-azuread, alp-entra-external-id) use to
      # call Logto's own API. They defaulted to http://localhost:$PORT, but with
      # HTTPS_CERT_PATH set there is no plaintext listener left, so those calls now
      # fail with ECONNRESET — which only shows up once a social connector is
      # configured. It must be a name the internal cert covers: `localhost` is not
      # in the SAN, hence the container's own FQDN. Verified against the internal CA
      # via NODE_EXTRA_CA_CERTS above; there is no verification bypass.
      LOGTO__SELF_BASE_URL: https://${PROJECT_NAME:-d2e}-logto-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:3001
      LOGTO_API_M2M_CLIENT_ID: ${LOGTO_API_M2M_CLIENT_ID}
      LOGTO_API_M2M_CLIENT_SECRET: ${LOGTO_API_M2M_CLIENT_SECRET}
      LOGTO_ROLES_AZ_GROUPS_MAPPING: ${LOGTO_ROLES_AZ_GROUPS_MAPPING:-{"role.systemadmin":"37b5364a-348c-494f-b67f-a59a40e52ab7","role.useradmin":"90597adc-92af-4649-8151-68c3b7feb66c","role.dashboardviewer":"50a3b140-21eb-46dd-9d81-61a77cbc81f5"}}
      NODE_ENV: test
      PROJECT_NAME: ${PROJECT_NAME:-d2e}
      PORT: 3001
      TRUST_PROXY_HEADER: true
      DATABASE_CONNECTION_TIMEOUT: 30000

  alp-minerva-postgres:
    container_name: &c17 ${PROJECT_NAME:-d2e}-minerva-postgres-1
    healthcheck:
      interval: 20s
      retries: 30
      start_period: 60s
      test:
        - CMD-SHELL
        - pg_isready
        - -d
        - ${POSTGRES_DB}
      timeout: 30s
    hostname: ${PROJECT_NAME:-d2e}-minerva-postgres-1.${TLS__INTERNAL__DOMAIN:-d2e.local}
    image: postgres:15-alpine
    logging:
      options:
        tag: *c17
    networks:
      alp:
        priority: 20
      data:
        priority: 10
    restart: ${DOCKER__RESTART_POLICY:-unless-stopped}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_connections=1000"
    shm_size: 1gb
    volumes:
      - pg-minerva-data-1:/var/lib/postgresql/data
      - ./cache/pgbackup:/backup
    environment:
      <<:
        - *x-tls
      POSTGRES_DB: ${PG_DB_NAME:-alp}
      POSTGRES_PASSWORD: ${PG_SUPER_PASSWORD}

  demodb:
    image: ohdsi/broadsea-atlasdb:2.3.0
    container_name: ${PROJECT_NAME:-d2e}-demodb
    mem_limit: "2G"
    command: >
      sh -c '
      set -e;
      echo "Starting PostgreSQL in background via original docker-entrypoint.sh...";
      /usr/local/bin/docker-entrypoint.sh postgres -c wal_level=logical &
      PG_PID=$!;
      echo "Waiting for PostgreSQL to become ready...";
        until pg_isready -q -U postgres -h localhost -p 5432; do
          echo "PostgreSQL is unavailable - sleeping for 1 second...";
          sleep 1;
        done;
      echo "PostgreSQL is ready on localhost:5432.";
      echo "Attempting to change password for user postgres...";
      psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "ALTER USER postgres WITH PASSWORD '\''${DEMO__DB_PASSWORD:-mypass}'\'';";
      echo "Adding table cohort_definition to demo_cdm_results schema...";
      psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE TABLE IF NOT EXISTS demo_cdm_results.cohort_definition ( cohort_definition_id integer NOT NULL, cohort_definition_name varchar(255) NOT NULL, cohort_definition_description text NULL, definition_type_concept_id integer NOT NULL, cohort_definition_syntax text NULL, subject_concept_id integer NOT NULL, cohort_initiation_date date NULL );";
      echo "PostgreSQL setup complete. Bringing PostgreSQL process (PID $PG_PID) to foreground...";
      wait $PG_PID;
      echo "PostgreSQL process (PID $PG_PID) has exited.";
      exit $?;'
    environment:
      POSTGRES_PASSWORD: ${DEMO__DB_PASSWORD:-mypass}
    networks:
      alp:
        priority: 20
      data:
        priority: 10
    platform: linux/amd64
    volumes:
      - demodb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: ${DOCKER__RESTART_POLICY:-unless-stopped}

  supabase-storage:
    container_name: &c19 ${PROJECT_NAME:-d2e}-supabase-storage-${BASE_PORT:-1}
    depends_on:
      trex:
        condition: service_healthy
      alp-minerva-postgres:
        condition: service_healthy
    platform: linux/amd64
    healthcheck:
      # localhost is not a SAN on the internal cert, so validation is skipped here
      # (the CA chain itself is exercised by callers on the docker network).
      test: ["CMD-SHELL", "curl -fk https://localhost:9000/status || exit 1"]
      timeout: 30s
      interval: 10s
      retries: 20
      start_period: 40s
    # Must be the FQDN: the internal cert's only SAN is *.${TLS__INTERNAL__DOMAIN}.
    hostname: ${PROJECT_NAME:-d2e}-supabase-storage-1.${TLS__INTERNAL__DOMAIN:-d2e.local}
    # Custom image: postgresql-client pre-installed for offline capability, plus
    # nginx terminating internal TLS in front of storage-api (no native TLS).
    #
    # Build it locally before the first start:  docker compose build supabase-storage
    # (docker-compose-local.yml carries the build stanza; `npm run start` does not
    # build.) The entrypoint below lives only in this custom image, so a published
    # tag built before that entrypoint existed fails to start with
    # `stat /usr/src/entrypoint.sh: no such file or directory`. CI is unaffected —
    # it builds this image from source and deploys it by run tag.
    image: ${DOCKER_IMAGE_PREFIX:-ghcr.io/ohdsi/}d2e-supabase-storage:${DOCKER_TAG_NAME:-develop}
    logging:
      options:
        tag: *c19
    networks:
      alp:
        priority: 20
      data:
        priority: 10
    restart: ${DOCKER__RESTART_POLICY:-unless-stopped}
    volumes:
      - supabase-storage-data:/var/lib/storage
    # The image entrypoint writes the internal cert and starts nginx, then execs
    # its arguments -- so the command below still runs exactly as before.
    entrypoint: ["/usr/src/entrypoint.sh", "/bin/sh", "-c"]
    command: >
      "set -e;
      echo 'Waiting 30 seconds for trex migrations...';
      sleep 30;
      echo 'Starting storage server in background (will run migrations)...';
      node dist/start/server.js &
      SERVER_PID=\$!;
      echo 'Waiting 20 seconds for storage migrations to complete...';
      sleep 20;
      echo 'Updating public.objects view to include user_metadata...';
      export PGPASSWORD='${PG_SUPER_PASSWORD}';
      psql -h '${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}' -p '${PG_PORT:-5432}' -U '${PG_SUPER_USER:-postgres}' -d '${PG_DB_NAME:-alp}' -c 'ALTER TABLE IF EXISTS storage.objects DISABLE ROW LEVEL SECURITY;';
      psql -h '${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}' -p '${PG_PORT:-5432}' -U '${PG_SUPER_USER:-postgres}' -d '${PG_DB_NAME:-alp}' -c 'DROP VIEW IF EXISTS public.objects CASCADE;';
      psql -h '${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}' -p '${PG_PORT:-5432}' -U '${PG_SUPER_USER:-postgres}' -d '${PG_DB_NAME:-alp}' -c 'CREATE VIEW public.objects AS SELECT * FROM storage.objects;';
      psql -h '${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}' -p '${PG_PORT:-5432}' -U '${PG_SUPER_USER:-postgres}' -d '${PG_DB_NAME:-alp}' -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON public.objects TO service_role;';
      psql -h '${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}' -p '${PG_PORT:-5432}' -U '${PG_SUPER_USER:-postgres}' -d '${PG_DB_NAME:-alp}' -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON public.objects TO authenticated;';
      psql -h '${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}' -p '${PG_PORT:-5432}' -U '${PG_SUPER_USER:-postgres}' -d '${PG_DB_NAME:-alp}' -c 'GRANT SELECT ON public.objects TO anon;';
      echo 'View setup complete. Storage server continuing...';
      wait \$SERVER_PID;"
    environment:
      <<:
        - *x-tls
      PROJECT_REF: ${PROJECT_REF:-default}
      # storage-api stays on loopback, HTTP only; nginx (started by the image's
      # entrypoint.sh) is the only thing listening on 9000/the docker network,
      # terminating TLS with the shared TLS__INTERNAL__* cert. Resolution order in
      # the image's config is SERVER_HOST || HOST and SERVER_PORT || PORT.
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 9001
      PORT: 9001
      FILE_SIZE_LIMIT: 1048576000
      DATABASE_URL: postgres://${PG_SUPER_USER:-postgres}:${PG_SUPER_PASSWORD}@${PG_HOST:-${PROJECT_NAME:-d2e}-minerva-postgres-1}:${PG_PORT:-5432}/${PG_DB_NAME:-alp}
      PGRST_JWT_SECRET: ${SUPABASE_STORAGE_JWT_SECRET:?SUPABASE_STORAGE_JWT_SECRET must be set (run d2e init); refusing a known default secret}
      SERVICE_KEY: ${SUPABASE_STORAGE_JWT_TOKEN:?SUPABASE_STORAGE_JWT_TOKEN must be set (run d2e init); refusing a known default token}
      MIGRATIONS_SCHEMA: storage
      MIGRATIONS_TABLE: migrations
      SKIP_MIGRATIONS: "false"
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      # Inert under STORAGE_BACKEND=file, but kept consistent: the old value used the
      # compose service name, which is not a SAN on the internal cert -- the FQDN is
      # required if the S3 backend ever goes live.
      GLOBAL_S3_ENDPOINT: https://${PROJECT_NAME:-d2e}-supabase-storage-1.${TLS__INTERNAL__DOMAIN:-d2e.local}:9000/s3
      GLOBAL_S3_PROTOCOL: "https"
      GLOBAL_S3_FORCE_PATH_STYLE: true
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub

  hana:
    container_name: hana
    hostname: hana
    image: saplabs/hanaexpress:2.00.082.00.20250528.1
    platform: linux/amd64
    ports:
      - 1128-1129:1128-1129
      - 39013:39013
      - 39017:39017
      - 39041-39045:39041-39045
      - 59013-59014:59013-59014
    volumes:
      - hana-data:/hana/mounts
    networks:
      alp:
      data:
    profiles: [hana]

