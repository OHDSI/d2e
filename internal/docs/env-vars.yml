  publish: true
  type: password
PG_WRITE_PASSWORD:
  comment: Write Permissions Only
  publish: true
  type: password
PG__LOGTO_MANAGER_PASSWORD:
  comment: null
  publish: true
  type: string
PLUGINS_DEV_PATH:
  comment: |
    Colon-separated list of directories scanned for plugins at startup. Each direct
    child directory containing a package.json with a "trex" section is registered.
    Later paths override earlier ones by package name (so local bind-mounts win
    over bundled-in-image plugins). Default: /usr/src/bundled-plugins:/usr/src/plugins
  publish: false
  type: string
PLUGINS_SEED:
  comment: |
    Opt-in registry-install seed list. No longer set by the d2e compose / helm
    defaults; plugins are now bundled into the trex image at build time. Set this
    only to install additional plugins from the registry on top of the bundled set.
  publish: false
  type: string
PLUGINS_SEED_UPDATE:
  comment: |
    boolean. Opt-in toggle for registry-install behavior; no longer set by the
    d2e compose / helm defaults since plugins are bundled into the trex image.
  publish: false
  type: string
PROJECT_NAME:
  comment: null
  publish: false
  type: string
REDIS_PASSWORD:
  comment: Redis Password
  publish: true
  type: string
SQL_RETURN_ON:
  comment: null
  publish: false
  type: string
TLS__CADDY_DIRECTIVE:
  comment: Generate self-signed or public x509 certificate
  publish: true
  type: string
TLS__EXTRA__CA_CRTS:
  comment: Additional trust anchors for upstreams that are not ours (e.g. an external PS config server with its own CA). One or more concatenated PEM blocks, needing real newlines — a value with literal `\n` is rejected at startup. Installed into the OS trust store, so `DENO_TLS_CA_STORE=system` consumers pick them up. There is no verification bypass.
  publish: true
  type: string
TLS__INTERNAL__CA_CRT:
  comment: Internal Microservice TLS Communication Certificate Authority
  publish: true
TLS__INTERNAL__CRT:
  comment: Internal Microservice TLS Communication Public Key
  publish: true
TLS__INTERNAL__DOMAIN:
  comment: Internal DNS domain for service-to-service TLS; must match the generated certificate's SAN. Defaults to `d2e.local` and is written back to the env file when certificates are generated. Cert generation also accepts the older `TLS__INTERNAL__DOMAIN_NAME`.
  publish: true
  type: string
TLS__INTERNAL__KEY:
  comment: Internal Microservice TLS Communication Private
  publish: true