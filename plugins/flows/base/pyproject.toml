[project]
name = "base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.4.4",
    "google-cloud-bigquery==3.6.0",
    "google-cloud-bigquery-storage==2.25.0",
    "httpx==0.27.2",
    # Undeclared prefect 3.6.x dependency: prefect/workers/base.py imports the
    # importlib_metadata backport, which opentelemetry-api>=1.43 no longer
    # provides transitively.
    "importlib-metadata==8.7.0",
    # fastapi 0.129+ router internals break prefect.server's PrefectRouter
    # (ephemeral server, prefect_test_harness); 0.128.0 is what the
    # prefecthq/prefect:3.6.10 image ships.
    "fastapi==0.128.0",
    "ibis-framework[duckdb,postgres]==10.0.0",
    "numpy==2.0.0",
    "openai==0.28",
    "pandas==2.2.2",
    "prefect[docker,shell]==3.6.10",
    "prefect-shell==0.3.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.10.6",
    "pyjwt==2.13.0",
    "sqlalchemy==2.0.38",
    "sqlalchemy-bigquery==1.14.1",
    "shinylive==0.8.5",
    "snowflake-sqlalchemy>=1.6,<2",
]

[project.optional-dependencies]
hana = [
    "sqlalchemy-hana==2.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.12.7",
    "uv==0.11.15",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.12.*"
r-base = "4.4.3.*"
# conda rpy2 links against conda r-base (the pypi wheel would compile against
# a system R that the worker image does not have). 3.6.x: conda-forge has no
# 3.5.x build against r-base 4.4; bumped from pypi rpy2==3.5.13.
rpy2 = ">=3.6,<3.7"
openjdk = "17.*"
# Toolchain + libs for renv source builds (R packages compile against the
# conda env, not apt: Posit binaries target apt distros and must stay off)
compilers = "*"
make = "*"
pkg-config = "*"
# runtime HANA driver installs (provision-envs.sh) need pip inside the env
pip = "*"
libxml2 = "*"
libxml2-devel = "*"
libarchive = "*"
# libpq headers + pg_config for RPostgres source builds
libpq = "*"
# graphics stack headers for systemfonts/textshaping/ragg/svglite/png.
# expat: fontconfig.pc requires expat.pc — without it the whole
# `pkg-config --cflags fontconfig freetype2` query fails and configure
# scripts fall back to system paths that don't exist in the env.
freetype = "*"
fontconfig = "*"
libpng = "*"
expat = "*"
cairo = "*"
libgit2 = "*"
libsodium = "*"
krb5 = "*"
# link-time .so symlinks for -lz/-llzma (conda-forge splits runtime libs
# libzlib/liblzma from the devel packages; rJava and friends link both)
zlib = "*"
liblzma-devel = "*"
# the xz CLI itself: R package builds unpack vendored .tar.xz sources
# (e.g. hades' r-duckdb runs `tar xJf`, which execs xz)
xz = "*"
# rpy2's conda dependency chain brings `packaging`; cap it so the conda-pinned
# version stays inside ibis-framework 10.0.0's `packaging<25` requirement.
packaging = "<25"

[tool.pixi.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"
# rJava/JNI: libjvm.so sits outside the default linker path of the conda env;
# without this, rJava's configure "JNI programs run" check (and .jinit at
# runtime) fails against the conda openjdk.
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib/jvm/lib/server:$LD_LIBRARY_PATH"
# renv must compile from source against the conda toolchain; Posit PPM binary
# packages link against apt-distro libs.
RENV_CONFIG_PPM_ENABLED = "FALSE"
# The global renv cache is shared across environments and serves binaries
# compiled against a DIFFERENT env's prefix/JDK (rJava from the base env
# broke the hades env). Each plugin env compiles its own packages.
RENV_CONFIG_CACHE_ENABLED = "FALSE"
# Host dotfile isolation: a developer's ~/.R/Makevars would otherwise leak
# arbitrary flags into every package build (seen: -march=native).
R_MAKEVARS_USER = "/dev/null"

[tool.pixi.tasks]
setup-assets = "bash setup_assets.sh"
setup-r = "bash setup_r.sh"

# The hana feature comes from [project.optional-dependencies]; the environment
# is provisioned at runtime only (INSTALL_SQLALCHEMY_HANA) — never shipped.
[tool.pixi.environments]
default = { solve-group = "default" }
