[project]
name = "data-transformation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "asyncio==4.0.0",
    "duckdb==1.4.0",
    "genson==1.3.0",
    "httpx==0.27.2",
    # Undeclared prefect 3.6.x dependency: prefect/workers/base.py imports the
    # importlib_metadata backport, which opentelemetry-api>=1.43 no longer
    # provides transitively.
    "importlib-metadata==8.7.0",
    # fastapi 0.129+ router internals break prefect.server's PrefectRouter
    # (ephemeral server, prefect_test_harness); 0.128.0 is what the
    # prefecthq/prefect:3.6.10 image ships.
    "fastapi==0.128.0",
    "ibis-framework[duckdb,postgres]==11.0.0",
    "jsonpath-ng==1.7.0",
    "numpy==2.0.0",
    "pandas==2.2.3",
    "pandasql==0.7.3",
    "prefect[dask,docker,shell]==3.6.10",
    "prefect-shell==0.3.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.10.6",
    "pydicom==2.4.5",
    "pyjwt==2.13.0",
    "pymssql==2.3.4",
    "pyomop==6.4.0",
    "python-calamine==0.3.1",
    "s3fs==2024.10.0",
    "sqlalchemy==2.0.38",
    "xmltodict==0.14.2",
    "xvfbwrapper>=0.2.15",
    "Cython==3.2.3",
    "setuptools==83.0.0",
    "wheel==0.46.2",
    "pyarrow==23.0.1",
    "wfdb==4.3.1",
]

[project.optional-dependencies]
# NER core stack (lockable). The two model packages (en_ner_bc5cdr_md,
# en_core_med7_trf) declare mutually exclusive spacy ranges (<3.8.0 vs
# >=3.8.14) and are installed as pinned assets by setup_assets.sh instead —
# same --no-deps semantics the previous image build used.
ner = [
    # Self-contained environment core (no-default-feature: PyNER's chain
    # requires numpy<2 — the previous image's pip layer silently downgraded
    # numpy over the uv env; here the NER env owns its numpy honestly).
    "prefect[docker,shell]==3.6.10",
    "importlib-metadata==8.7.0",
    "fastapi==0.128.0",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "httpx==0.27.2",
    "pydantic==2.10.6",
    "pyjwt==2.13.0",
    "psycopg2-binary==2.9.9",
    "sqlalchemy==2.0.38",
    "ibis-framework[duckdb,postgres]==11.0.0",
    "scispacy==0.5.5",
    "scipy==1.16.0",
    # scispacy 0.5.5 requires spacy>=3.7,<3.8 (the old image force-installed
    # 3.8.2 over it); 3.7.x also satisfies the bc5cdr model. The med7 model
    # (declared: spacy>=3.8.14) is the single remaining declared-range
    # violation — unchanged from production, installed as an asset.
    "spacy>=3.7.0,<3.8.0",
    "spacy-transformers==1.3.9",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl",
    "nmslib @ git+https://github.com/nmslib/nmslib.git@2ae5378#subdirectory=python_bindings",
    "py-name-entity-recognition @ git+https://github.com/data2evidence/py_name_entity_recognition@release-v1.0.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
dataflow_ui = [
    "genson==1.3.0",
    "jsonpath-ng==1.7.0",
    "prefect[dask]==3.0.3",
]
dicom-etl = [
    "pydicom==2.4.5",
    "s3fs==2024.10.0",
]
white-rabbit = [
    "pandasql==0.7.3",
    "python-calamine==0.3.1",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = "3.12.*"
r-base = "4.4.3.*"
# conda rpy2 links against conda r-base; 3.6.x is the earliest series built
# for r-base 4.4 (bumped from pypi rpy2==3.5.13).
rpy2 = ">=3.6,<3.7"
openjdk = "17.*"
nodejs = "*"
compilers = "*"
make = "*"
pkg-config = "*"
libxml2 = "*"
libxml2-devel = "*"
libarchive = "*"
# libpq headers + pg_config for RPostgres source builds
libpq = "*"
# graphics stack headers for systemfonts/textshaping/ragg/svglite/png.
# expat: fontconfig.pc requires expat.pc — without it the whole
# `pkg-config --cflags fontconfig freetype2` query fails and configure
# scripts fall back to system paths that don't exist in the env.
freetype = "*"
fontconfig = "*"
libpng = "*"
expat = "*"
cairo = "*"
libgit2 = "*"
libsodium = "*"
krb5 = "*"
# link-time .so symlinks for -lz/-llzma (conda-forge splits runtime libs
# libzlib/liblzma from the devel packages; rJava and friends link both)
zlib = "*"
liblzma-devel = "*"
# the xz CLI itself: R package builds unpack vendored .tar.xz sources
# (e.g. hades' r-duckdb runs `tar xJf`, which execs xz)
xz = "*"
# rpy2's conda dependency chain brings `packaging`; keep the conda pin inside
# the pypi requirements' bounds.
packaging = "<25"

[tool.pixi.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib/jvm/lib/server:$LD_LIBRARY_PATH"
# venv wrapper created by setup_assets.sh — reticulate rejects the conda-
# structured env python outright (wants a conda binary to activate it)
RETICULATE_PYTHON = "$PIXI_PROJECT_ROOT/.pixi/envs/default/reticulate-venv/bin/python"
RENV_CONFIG_PPM_ENABLED = "FALSE"
# The global renv cache is shared across environments and serves binaries
# compiled against a DIFFERENT env's prefix/JDK. Each plugin env compiles
# its own packages.
RENV_CONFIG_CACHE_ENABLED = "FALSE"
# Host dotfile isolation: a developer's ~/.R/Makevars would otherwise leak
# arbitrary flags into every package build (seen: -march=native).
R_MAKEVARS_USER = "/dev/null"

[tool.pixi.tasks]
setup-r = "bash setup_r.sh"
setup-assets = "bash setup_assets.sh"

# x86-only, unlike the rest of the workspace. Two of the NER stack's pins have
# no aarch64 form: torch is pinned to a literal manylinux_2_28_x86_64 wheel URL
# on download.pytorch.org (the +cpu build is published for x86_64 only), and
# nmslib-metabrainz publishes no aarch64 wheel at all, so an aarch64 solve
# falls back to its sdist — which the binary-only lock rule forbids and which
# would compile at provision time. Narrowing the feature keeps the `ner`
# environment out of the aarch64 solve entirely; the default environment stays
# multi-arch. provision-envs.sh skips environments the running platform does
# not declare.
[tool.pixi.feature.ner]
platforms = ["linux-64"]

# Conda side of the self-contained ner environment (no-default-feature drops
# the default conda deps): interpreter + toolchain for nmslib's C++ build.
[tool.pixi.feature.ner.dependencies]
python = "3.12.*"
# setup_assets.sh installs the model packages with the ner env's pip
pip = "*"
packaging = "<25"
compilers = "*"
make = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
# Own solve-group: the NER stack's pins (scipy 1.16, torch 2.8 cpu) must not
# constrain the default environment.
ner = { features = ["ner"], no-default-feature = true }

# NOTE: the existing [project.optional-dependencies] extras duplicate
# [project.dependencies] entries, so the default environment already equals
# today's `uv sync --all-extras` install. The NER stack is NOT declared here —
# its closure is unlockable by metadata (see the migration plan, Task 3.2);
# pending decision: models-as-assets vs Docker carve-out.
