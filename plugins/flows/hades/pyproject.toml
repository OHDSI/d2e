# and r-rsconnect pulls the latest conda-forge renv (1.2.x), which setup_r.sh
# then uses instead of installing the snapshot's. renv 1.2.x resolved GitHub
# records to their current HEADs (Keeper 2.1.3, needing DatabaseConnector >=
# 7.0.0) instead of the locked commits. Hold it to the snapshot version that
# linux-64 installs, as data_transformation and base do via their renv.lock.
"r-renv" = "==1.1.5"
