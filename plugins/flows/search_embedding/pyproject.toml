[project]
name = "search-embedding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.4.0",
    # Undeclared prefect 3.6.x dependency: prefect/workers/base.py imports the
    # importlib_metadata backport, which opentelemetry-api>=1.43 no longer
    # provides transitively.
    "importlib-metadata==8.7.0",
    # fastapi 0.129+ router internals break prefect.server's PrefectRouter
    # (ephemeral server, prefect_test_harness); 0.128.0 is what the
    # prefecthq/prefect:3.6.10 image ships.
    "fastapi==0.128.0",
    "ibis-framework[duckdb,postgres]==10.0.0",
    "pandas==2.2.2",
    "prefect[docker,shell]==3.6.10",
    "psycopg2-binary==2.9.9",
    "pydantic==2.10.6",
    "pyjwt==2.13.0",
    "sqlalchemy==2.0.38",
    # CPU wheel, pinned by URL: the PyPI sdist/wheel pulls the CUDA runtime
    # (nvidia-* 2.7GB + triton 684MB + cusparselt 203MB) and a CUDA-linked
    # torch, none of which any deployment can use - no chart or compose file
    # requests a GPU, so flow.py always resolves device to cpu. Same form as
    # data_transformation's ner feature.
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.6.0%2Bcpu-cp312-cp312-linux_x86_64.whl",
    "tqdm==4.66.4",
    # ==4.57.6: develop's uv.lock resolution — transformers v5 changes embedding
# outputs, breaking score-exact e2e assertions (hybrid search)
"transformers==4.57.6",
]

[project.optional-dependencies]
hana = [
    "sqlalchemy-hana==2.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.12.7",
    "uv==0.11.15",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
# runtime HANA driver installs (provision-envs.sh) need pip inside the env
pip = "*"
# conda pip pulls packaging 26.x, which the conda solve would pin over the
# pypi requirements' bounds (ibis needs <25)
packaging = "<25"
python = "3.12.*"

[tool.pixi.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

[tool.pixi.tasks]
setup-assets = "bash setup_assets.sh"

# The hana feature comes from [project.optional-dependencies]; the environment
# is provisioned at runtime only (INSTALL_SQLALCHEMY_HANA) — never shipped.
[tool.pixi.environments]
default = { solve-group = "default" }
