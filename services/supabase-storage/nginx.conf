# Internal-CA TLS termination in front of storage-api, which has no native TLS
# support of its own (its config exposes only SERVER_HOST/SERVER_PORT). nginx owns
# the docker-network port 9000; storage-api listens on loopback:9001.
# Cert/key are written at container start by entrypoint.sh from TLS__INTERNAL__*.
server {
    listen 9000 ssl;

    ssl_certificate     /usr/src/cert/cert.pem;
    ssl_certificate_key /usr/src/cert/key.pem;

    # storage-api's own FILE_SIZE_LIMIT is 1000 MB; nginx's default 1m cap would
    # reject dataset-resource and shinylive uploads well below that limit.
    client_max_body_size 0;
    # Stream large uploads through instead of spooling the whole body to disk first.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        # $host drops the port; the /s3 endpoints sign the Host header (sig-v4),
        # so the client's original host:port must survive the proxy hop.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
